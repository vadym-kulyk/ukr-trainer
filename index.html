  }
  function correctHtml(task) {
    if (task.t === "one") return `<span>Правильна відповідь: <b>${task.opts[task.a]}</b></span>`;
    if (task.t === "order") return `<span>Правильний порядок: <b>${task.items.map(esc).join(" ")}</b></span>`;
    return "";
  }
  function newPend(task, topic) {
    const p = { i: task.n, topic };
    if (task.t === "one") p.v = null;
    if (task.t === "multi") p.v = [];
    if (task.t === "sort") p.v = task.items.map(() => null);
    if (task.t === "match") { p.v = task.left.map(() => null); p.sel = null; }
    if (task.t === "order") { p.v = []; p.pool = E.shuffle(E.rngFrom("ord" + topic + task.n), task.items.map((_, k) => k)); }
    return p;
  }
  function ready(task) {
    if (task.t === "one") return pend.v !== null;
    if (task.t === "multi") return pend.v.length > 0;
    if (task.t === "sort" || task.t === "match") return pend.v.every(v => v !== null);
    if (task.t === "order") return pend.v.length === task.items.length;
    return false;
  }
  function bodyHtml(task, done, resp) {
    const dis = done ? "disabled" : "";
    if (task.t === "one") {
      const two = task.opts.length === 2 && task.opts.every(o => o.length < 24);
      return `<div class="opts ${two ? "two" : ""}">` + task.opts.map((o, k) => {
        let cls = "", tag = "";
        if (done) { if (k === task.a) { cls = "ok"; tag = "✓"; } else if (k === resp) { cls = "no"; tag = "✗"; } }
        else if (pend && pend.v === k) cls = "sel";
        return `<button class="opt ${cls}" data-one="${k}" aria-pressed="${!done && pend && pend.v === k}" ${dis}>${two ? "" : `<span class="key">${"АБВГДЕ"[k]}</span>`}<span>${o}</span>${tag ? `<span class="tag">${tag}</span>` : ""}</button>`;
      }).join("") + "</div>";
    }
    if (task.t === "multi") {
      const chosen = done ? (resp || []) : pend.v;
      return '<div class="opts">' + task.opts.map((o, k) => {
        const on = chosen.includes(k), right = task.a.includes(k);
        let cls = on ? "sel" : "", tag = "";
        if (done) { cls = right && on ? "ok" : on ? "no" : right ? "miss" : ""; tag = right && on ? "✓" : on ? "✗" : right ? "пропущено" : ""; }
        return `<button class="opt ${cls}" data-multi="${k}" aria-pressed="${on}" ${dis}><span class="box-ic">${on ? "✓" : ""}</span><span>${o}</span>${tag ? `<span class="tag">${tag}</span>` : ""}</button>`;
      }).join("") + "</div>";
    }
    if (task.t === "sort") {
      const v = done ? (resp || []) : pend.v;
      return '<div class="sort-list">' + task.items.map((it, k) => `<div class="sort-item"><span class="w">${it.html}</span><div class="seg" role="group">` +
        task.cats.map((c, ci) => {
          let cls = v[k] === ci ? "on" : "";
          if (done) cls = ci === it.c ? (v[k] === ci ? "ok" : "ok") : v[k] === ci ? "no" : "";
          if (done && ci === it.c && v[k] !== ci) cls = "ok";
          return `<button class="${cls}" data-sort="${k}:${ci}" aria-pressed="${v[k] === ci}" ${dis}>${c}</button>`;
        }).join("") + "</div></div>").join("") + "</div>";
    }
    if (task.t === "match") {
      const v = done ? (resp || task.left.map(() => null)) : pend.v;
      let h = '<div class="match"><div class="match-col"><h4>Ліворуч — оберіть</h4>';
      task.left.forEach((l, k) => {
        const paired = v[k] !== null && v[k] !== undefined;
        let cls = paired ? "p" + k : ""; if (!done && pend.sel === k) cls += " picked";
        if (done) cls += task.right[v[k]] && task.right[v[k]].li === k ? " ok" : " no";
        h += `<button class="mi ${cls}" data-ml="${k}" ${dis}><span class="num">${k + 1}</span><span>${l}</span></button>`;
      });
      h += '</div><div class="match-col"><h4>Праворуч — поєднайте</h4>';
      task.right.forEach((r, k) => {
        const owner = v.indexOf(k);
        let cls = owner >= 0 ? "p" + owner : "";
        if (done) cls += r.li === owner ? " ok" : " no";
        h += `<button class="mi ${cls}" data-mr="${k}" ${dis}><span class="num">${owner >= 0 ? owner + 1 : "·"}</span><span>${r.html}</span></button>`;
      });
      h += "</div></div>";
      if (done) h += '<span class="hint">Номер праворуч показує, з чим ви поєднали. Правильні пари — у поясненні нижче.</span>';
      else h += '<span class="hint">Торкніться слова ліворуч, а потім відповідного варіанта праворуч. Повторне торкання знімає пару.</span>';
      return h;
    }
    if (task.t === "order") {
      const v = done ? (resp || []) : pend.v;
      let h = '<div class="order-line">' + (v.length ? v.map((k, pos) => `<button class="tok in" data-unord="${pos}" ${dis}>${esc(task.items[k])}</button>`).join("") : '<span class="ph">Торкайтеся частин нижче по черзі</span>') + "</div>";
      if (!done) h += '<div class="pool">' + pend.pool.map(k => `<button class="tok ${v.includes(k) ? "used" : ""}" data-ord="${k}" ${v.includes(k) ? "disabled" : ""}>${esc(task.items[k])}</button>`).join("") + "</div>";
      return h;
    }
    return "";
  }
  function plain(h) {
    const div = document.createElement("div");
    div.innerHTML = String(h).replace(/<span class="gap">…<\/span>/g, "…").replace(/<span class="st">(.)<\/span>/g, (m, c) => c.toUpperCase());
    return div.textContent.replace(/\s+/g, " ").trim();
  }
  function answerText(task, resp) {
    if (task.t === "one") return plain(task.opts[resp]);
    if (task.t === "multi") return resp.map(k => plain(task.opts[k])).join("; ");
    if (task.t === "sort") return task.items.map((it, k) => plain(it.html) + " → " + plain(task.cats[resp[k]])).join("; ");
    if (task.t === "match") return task.left.map((l, k) => plain(l) + " — " + plain(task.right[resp[k]].html)).join("; ");
    if (task.t === "order") return resp.map(k => task.items[k]).join(" ");
    return "";
  }
  function rightText(task) {
    if (task.t === "one") return plain(task.opts[task.a]);
    if (task.t === "multi") return task.a.map(k => plain(task.opts[k])).join("; ");
    if (task.t === "sort") return task.items.map(it => plain(it.html) + " → " + plain(task.cats[it.c])).join("; ");
    if (task.t === "match") return task.left.map((l, k) => plain(l) + " — " + plain(task.right.find(r => r.li === k).html)).join("; ");
    if (task.t === "order") return task.items.join(" ");
    return "";
  }
  function nextOpen(st, from) {
    for (let k = 1; k <= N; k++) { const j = (from + k) % N; if (st.r[j] === ".") return j; }
    return -1;
  }
  function answer(t, task, resp) {
    const st = tstate(t.id);
    if (st.r[task.n] !== ".") return;
    const ok = E.check(task, resp);
    st.r = st.r.slice(0, task.n) + (ok ? "1" : "0") + st.r.slice(task.n + 1);
    st.ch[task.n] = resp;
    const s = me();
    (s.queue = s.queue || []).push({ id: store.current + "|" + t.id + "|" + (st.att || 1) + "|" + task.n, topic: t.id, att: st.att || 1, n: task.n + 1, type: task.t, ok, at: Date.now(),
      q: plain(task.q) + (task.big ? " — " + plain(task.big) : ""), ans: answerText(task, resp), right: rightText(task) });
    if (s.queue.length > 3000) s.queue = s.queue.slice(-3000);
    pend = null; saveLocal(); scheduleSync(); render();
  }

  function copyText(text, fallbackEl) {
    const done = () => toast("Скопійовано");
    const fail = () => { if (fallbackEl) { fallbackEl.hidden = false; fallbackEl.value = text; fallbackEl.focus(); fallbackEl.select(); toast("Виділено — скопіюйте вручну"); } };
    try { navigator.clipboard.writeText(text).then(done, fail); } catch (e) { fail(); }
  }

  /* ───── Події ───── */
  app.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    const d = b.dataset;
    if (d.home) { store.home = d.home; saveLocal(); render(); return; }
    if (d.theory) { openTheory(d.theory); return; }
    if (FX.onClick(b)) return;
    if (NM.onClick(b)) return;
    if (Z.onClick(b)) return;
    if (d.open) { ui = Object.assign(ui, { view: "topic", topic: d.open, tab: d.tab, reviewing: false }); confirmReset = false; pend = null; jumpFirst(); render(); window.scrollTo(0, 0); return; }
    if (d.tabto) { ui.tab = d.tabto; if (d.tabto === "tasks") jumpFirst(); render(); window.scrollTo(0, 0); return; }
    if (b.id === "copy-report") { copyText(reportText(), $("#report-text")); return; }
    const act = d.act;
    if (act === "home") { ui.view = "home"; confirmReset = false; render(); window.scrollTo(0, 0); return; }
    if (act === "focus-name") { ui.view = "home"; render(); window.scrollTo(0, 0); const f = $("#p-first"); if (f) f.focus(); return; }
    if (act === "finish") { ui.view = "home"; render(); window.scrollTo(0, 0); toast("Прогрес збережено. Повернутися можна будь-коли."); return; }
    if (act === "reset") { confirmReset = true; render(); return; }
    if (act === "reset-no") { confirmReset = false; render(); return; }
    if (act === "reset-yes") { const s = me(); if (s) { const prevAtt = (s.topics[ui.topic] && s.topics[ui.topic].att) || 1; s.topics[ui.topic] = { r: EMPTY, ch: {}, att: prevAtt + 1 }; resetIds.add(ui.topic); saveLocal(); scheduleSync(true); } confirmReset = false; ui.cur = 0; ui.reviewing = false; pend = null; render(); toast("Тему почато заново"); return; }
    if (act === "map") { ui.map = !ui.map; render(); return; }
    if (act === "review") { ui.reviewing = true; ui.cur = 0; ui.map = true; render(); return; }
    if (d.go !== undefined) { ui.cur = +d.go; ui.reviewing = true; pend = null; render(); scrollTask(); return; }
    if (act === "prev") { ui.cur = Math.max(0, ui.cur - 1); ui.reviewing = true; pend = null; render(); scrollTask(); return; }
    if (act === "next") { ui.cur = Math.min(N - 1, ui.cur + 1); ui.reviewing = true; pend = null; render(); scrollTask(); return; }
    if (act === "next-open") { const st = tstate(ui.topic), j = nextOpen(st, ui.cur); if (j < 0) { ui.reviewing = false; } else ui.cur = j; pend = null; render(); scrollTask(); return; }
    const t = T.find(x => x.id === ui.topic); if (!t || !loggedIn()) return;
    const task = tasksOf(t.id)[ui.cur];
    if (pend && inputClick(d, pend)) { render(); return; }
    if (act === "check") { if (!ready(task)) return; answer(t, task, task.t === "one" ? pend.v : task.t === "multi" ? pend.v.slice().sort((a, b) => a - b) : pend.v.slice()); return; }
  });
  /* Вибір відповіді (без перевірки): змінює стан p. Спільне для тем і розділу «Мої помилки». */
  function inputClick(d, p) {
    if (d.one !== undefined) { p.v = +d.one; return true; }
    if (d.multi !== undefined) { const k = +d.multi, ix = p.v.indexOf(k); if (ix >= 0) p.v.splice(ix, 1); else p.v.push(k); return true; }
    if (d.sort) { const [k, c] = d.sort.split(":").map(Number); p.v[k] = c; return true; }
    if (d.ml !== undefined) { const k = +d.ml; if (p.v[k] !== null) { p.v[k] = null; p.sel = k; } else p.sel = k; return true; }
    if (d.mr !== undefined) {
      const r = +d.mr, owner = p.v.indexOf(r);
      if (owner >= 0) { p.v[owner] = null; return true; }
      let sel = p.sel; if (sel === null) sel = p.v.indexOf(null);
      if (sel >= 0) { p.v[sel] = r; p.sel = null; const nx = p.v.indexOf(null); if (nx >= 0 && p.sel === null) p.sel = nx; }
      return true;
    }
    if (d.ord !== undefined) { p.v.push(+d.ord); return true; }
    if (d.unord !== undefined) { p.v.splice(+d.unord, 1); return true; }
    return false;
  }
  function jumpFirst() {
    if (!me() || !ui.topic) return;
    const st = tstate(ui.topic), j = st.r.indexOf(".");
    ui.cur = j >= 0 ? j : 0; ui.reviewing = false;
  }
  /* Після переходу до іншого завдання показуємо його початок одразу під закріпленою панеллю. */
  function scrollTask() {
    const el = document.querySelector(".task"), bar = document.querySelector(".topbar");
    if (!el) return;
    const barBottom = bar ? bar.getBoundingClientRect().bottom : 0;
    const top = el.getBoundingClientRect().top;
    if (top < barBottom + 8 || top > window.innerHeight * 0.6) {
      const smooth = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      window.scrollBy({ top: top - barBottom - 8, behavior: smooth ? "smooth" : "auto" });
    }
  }


  /* ───── Бічна панель: теорія під час завдань і тлумачний словник ───── */
  const sheet = $("#sheet"), sheetBody = $("#sheet-body");
  let sheetReturn = null;
  function openSheet(title, link) {
    $("#sheet-h").textContent = title;
    const a = $("#sheet-link"); a.hidden = !link; if (link) a.href = link;
    sheetReturn = document.activeElement;
    sheet.hidden = false; document.documentElement.classList.add("sheet-open");
    setTimeout(() => $("#sheet-close").focus(), 30);
  }
  function closeSheet() {
    if (sheet.hidden) return;
    sheet.hidden = true; document.documentElement.classList.remove("sheet-open");
    sheetBody.innerHTML = ""; $("#sheet-search").hidden = true;
    if (sheetReturn && sheetReturn.focus) sheetReturn.focus();
  }
  function theoryRef(ref) {
    const [kind, id] = String(ref).split(":");
    if (kind === "t") { const t = T.find(x => x.id === id); return t ? { ref, title: t.title } : null; }
    if (kind === "z") { const title = Z.titleOf(id); if (!title) Z.loadIndex(); return { ref, title: title || "теорія до теми" }; }
    return null;
  }
  function openTheory(ref) {
    const [kind, id] = String(ref).split(":");
    $("#sheet-search").hidden = true;
    if (kind === "t") {
      const t = T.find(x => x.id === id); if (!t) return;
      openSheet("Теорія: " + t.title);
      sheetBody.innerHTML = '<p class="empty">Завантажую теорію…</p>';
      loadTheoryFile(id).then(x => { sheetBody.innerHTML = `<article class="theory in-sheet"><div class="tbody">${x}</div></article>`; sheetBody.scrollTop = 0; });
    } else {
      openSheet("Теорія");
      sheetBody.innerHTML = '<p class="empty">Завантажую теорію…</p>';
      Z.theoryFor(id).then(r => { $("#sheet-h").textContent = "Теорія: " + r.title; sheetBody.innerHTML = `<article class="theory in-sheet">${r.html}</article>`; sheetBody.scrollTop = 0; })
        .catch(() => { sheetBody.innerHTML = '<p class="empty">Не вдалося завантажити теорію. Перевірте інтернет.</p>'; });
    }
    sheetBody.scrollTop = 0;
  }
  const DICT = w => "https://slovnyk.ua/index.php?swrd=" + encodeURIComponent(w);
  function openDict(word) {
    if (NM.inExam()) return;
    word = (word || "").trim();
    openSheet(word ? "Словник: «" + word + "»" : "Тлумачний словник", word ? DICT(word) : "https://slovnyk.ua/");
    const f = $("#sheet-search"); f.hidden = false; $("#sheet-q").value = word;
    sheetBody.innerHTML = word
      ? `<div class="dict-wrap"><span class="dict-wait">Завантажую словник…</span><iframe class="dict-frame" src="${esc(DICT(word))}" title="Значення слова «${esc(word)}» на slovnyk.ua" onload="this.classList.add('ready')"></iframe></div><p class="dict-src">Джерело: <a href="https://slovnyk.ua/" target="_blank" rel="noopener">slovnyk.ua</a> — «Словник української мови» в 11 томах та інші словники.</p>`
      : '<div class="dict-hint"><p><b>Як шукати значення слова</b></p><p>Впишіть слово вгорі й натисніть «Знайти».</p><p>Або просто <b>виділіть слово</b> в теорії чи завданні (на телефоні — затисніть слово пальцем) і натисніть кнопку «Значення» внизу екрана.</p></div>';
    if (!word) setTimeout(() => $("#sheet-q").focus(), 60);
  }
  $("#sheet-close").addEventListener("click", closeSheet);
  sheet.addEventListener("click", e => {
    if (e.target === sheet) { closeSheet(); return; }
    const b = e.target.closest("[data-theory]"); if (b) openTheory(b.dataset.theory);
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
  $("#sheet-search").addEventListener("submit", e => { e.preventDefault(); const w = $("#sheet-q").value.trim(); if (w) openDict(w); });
  $("#dict-btn").addEventListener("click", () => openDict(""));

  /* Кнопка «Теорія» під час виконання завдань теми. */
  const fab = $("#fab-theory");
  function updateFab() {
    let ref = null;
    if (ui.view === "topic" && ui.tab === "tasks" && ui.topic) ref = "t:" + ui.topic;
    if (ui.view === "ztopic" && ui.tab === "tasks" && ui.ztopic) ref = "z:" + ui.ztopic;
    fab.hidden = !ref; if (ref) fab.dataset.ref = ref;
    document.body.classList.toggle("has-fab", !!ref);
  }
  fab.addEventListener("click", () => openTheory(fab.dataset.ref));

  /* Виділене слово → кнопка «Значення» → словник. */
  const selchip = $("#selchip");
  let selWord = "", selTimer = null;
  function readSelection() {
    const sel = window.getSelection ? window.getSelection() : null;
    if (!sel || sel.isCollapsed || NM.inExam()) return "";
    const node = sel.anchorNode && (sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement);
    if (!node || !node.closest("#app") || node.closest("input, textarea")) return "";
    let w = sel.toString().normalize("NFC").replace(/\u0301/g, "").replace(/[«»"“”„()\[\].,;:!?…—–]+/g, " ").replace(/\s+/g, " ").trim();
    w = w.replace(/^[-’'ʼ]+|[-’'ʼ]+$/g, "");
    if (!w || w.length > 40 || w.split(" ").length > 3 || !/^[\p{L}’'ʼ -]+$/u.test(w)) return "";
    if (/[а-яґєії][А-ЯҐЄІЇ]/.test(w)) w = w.toLowerCase();
    return w;
  }
  document.addEventListener("selectionchange", () => {
    clearTimeout(selTimer);
    selTimer = setTimeout(() => {
      selWord = readSelection();
      selchip.hidden = !selWord;
      if (selWord) selchip.innerHTML = `📖 Значення: <b>${esc(selWord)}</b>`;
    }, 220);
  });
  selchip.addEventListener("pointerdown", e => e.preventDefault());
  selchip.addEventListener("click", () => { const w = selWord; selchip.hidden = true; if (window.getSelection) window.getSelection().removeAllRanges(); if (w) openDict(w); });

  /* Пошук у словничках теорії (наголоси, фразеологізми). */
  document.addEventListener("input", e => {
    const f = e.target.closest && e.target.closest(".wl-filter"); if (!f) return;
    const box = f.closest(".wl-box"), q = f.value.trim().toLowerCase().replace(/\u0301/g, "");
    let shown = 0;
    box.querySelectorAll(".wl [data-w]").forEach(el => { const hit = !q || el.dataset.w.includes(q); el.hidden = !hit; if (hit) shown++; });
    box.querySelectorAll(".wl section").forEach(sec => { sec.hidden = !sec.querySelector("[data-w]:not([hidden])"); });
    const em = box.querySelector(".wl-empty"); if (em) em.hidden = shown > 0;
  });
  NM.bindDrag(app);
  { const run = loggedIn() && NM.activeRun(); if (run) Object.assign(ui, { view: "nmt", ntest: run, nstage: "exam" }); }
  renderProfile();
  render();
  initSync();
})();
</script>

</body>
</html>
