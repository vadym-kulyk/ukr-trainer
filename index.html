<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Тренажер з української мови: фонетика, орфографія, лексика. Теорія та 100 завдань з кожної теми.">
<title>Мовний тренажер Midgard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
[hidden] { display: none !important; }
/* Layout: одна центральна колонка (макс. 860px) — шапка з ім’ям, картки тем, екран теми з вкладками «Теорія / Завдання». */
:root {
  --lime: #99cc00; --violet: #9d6bdb; --yellow: #f7c915;
  --wrong: #c13f2c; --right: #3f7a16;
  --bg: #ffffff; --surface: #faf8fc; --surface-2: #f2eef8; --line: #e5e0ee; --text: #1e1b26;
  --muted: color-mix(in srgb, var(--text) 62%, transparent);
  --lime-ink: #3f6a00; --violet-ink: #6b3fb0;
  --right-bg: color-mix(in srgb, var(--right) 13%, transparent);
  --wrong-bg: color-mix(in srgb, var(--wrong) 12%, transparent);
  --f-display: 'Unbounded', 'Rubik', system-ui, sans-serif;
  --f-text: 'Manrope', 'PT Sans', 'Fira Sans', system-ui, sans-serif;
  --f-mono: 'JetBrains Mono', 'PT Mono', ui-monospace, monospace;
  --r: 18px; --r-sm: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12101a; --surface: #1b1826; --surface-2: #231f31; --line: #332d44; --text: #f4f1f9;
  --wrong: #ff7a5e; --right: #a5d914; --lime-ink: #b8e63a; --violet-ink: #c4a3f0; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #12101a; --surface: #1b1826; --surface-2: #231f31; --line: #332d44; --text: #f4f1f9;
  --wrong: #ff7a5e; --right: #a5d914; --lime-ink: #b8e63a; --violet-ink: #c4a3f0; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--f-text); font-size: 16px; line-height: 1.55; overflow-x: hidden; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; letter-spacing: -0.01em; text-wrap: balance; margin: 0; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.wrap { max-width: 860px; margin: 0 auto; padding-inline: 16px; }

/* ── Шапка ── */
.hero { position: relative; overflow: hidden; border-bottom: 1px solid var(--line); background: var(--surface); }
.mark { position: absolute; pointer-events: none; user-select: none; opacity: .11; z-index: 0; width: 300px; max-width: none; }
.mark--r { right: -150px; top: -60px; }
.mark--l { left: -170px; bottom: -150px; opacity: .09; }
.hero .wrap { position: relative; z-index: 1; padding-block: 20px 18px; display: grid; gap: 14px; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.logo { width: clamp(132px, 34vw, 170px); height: auto; display: block; }
.brand-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.hero h1 { font-size: clamp(22px, 5.4vw, 32px); font-weight: 800; }
.hero h1 em { font-style: normal; background: linear-gradient(transparent 62%, color-mix(in srgb, var(--lime) 55%, transparent) 62%); }
.sub { margin: 0; color: var(--muted); max-width: 62ch; }
.namebox { display: grid; gap: 6px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.namebox label { font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.namerow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
#student-name { flex: 1 1 220px; min-width: 0; border: 2px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; background: var(--surface); font-size: 17px; font-weight: 600; }
#student-name:focus { border-color: var(--lime); outline: none; }
.namebox.need #student-name { border-color: var(--yellow); }
.hint { font-size: 13px; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); white-space: normal; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--yellow); flex: none; }
.chip.ok .dot { background: var(--lime); }
.chip.bad .dot { background: var(--wrong); }
.overall { display: grid; gap: 6px; }
.overall-top { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; flex-wrap: wrap; }
.bar { height: 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; position: relative; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--lime); border-radius: 999px; }
.bar b { position: absolute; inset: 0 auto 0 0; background: color-mix(in srgb, var(--violet) 35%, transparent); border-radius: 999px; }

.who { display: none; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; }
body.compact .who { display: flex; }
body.compact .hero h1, body.compact .sub, body.compact .namebox, body.compact .overall { display: none; }
body.compact .hero .wrap { padding-block: 10px; gap: 8px; }
body.compact .logo { width: 132px; }
/* ── Кнопки ── */
.btn { border: 2px solid var(--line); background: var(--bg); border-radius: 999px; padding: 9px 16px; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; }
.btn:hover { border-color: var(--violet); }
.btn.primary { background: var(--lime); border-color: var(--lime); color: #1e1b26; }
.btn.primary:hover { filter: brightness(1.05); border-color: var(--lime); }
.btn.primary:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.btn.ghost { border-color: transparent; background: transparent; padding-inline: 10px; }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 14px; }
.btn.danger { border-color: var(--wrong); color: var(--wrong); }

/* ── Список тем ── */
main { padding-block: 22px 60px; }
.section { display: grid; gap: 12px; margin-bottom: 28px; }
.section-h { display: flex; align-items: baseline; gap: 10px; }
.section-h .mono { color: var(--violet-ink); font-weight: 600; }
.section-h h2 { font-size: 18px; font-weight: 700; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.card h3 { font-size: 15px; font-weight: 700; font-family: var(--f-text); letter-spacing: 0; line-height: 1.3; }
.card .meta { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.card .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.card .acts .btn { flex: 1 1 auto; justify-content: center; }
.badge100 { font-size: 12px; font-weight: 800; color: #1e1b26; background: var(--yellow); border-radius: 999px; padding: 2px 8px; }
.report { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 8px; }
.report textarea { width: 100%; min-height: 120px; font-family: var(--f-mono); font-size: 12px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--bg); color: var(--text); padding: 8px; }

/* ── Екран теми ── */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.topbar .wrap { display: grid; gap: 8px; padding-block: 10px; }
.tb-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.tb-title { font-family: var(--f-display); font-weight: 700; font-size: 15px; line-height: 1.2; min-width: 0; overflow-wrap: anywhere; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--surface-2); padding: 4px; border-radius: 999px; }
.tab { border: 0; background: transparent; border-radius: 999px; padding: 8px 10px; font-weight: 700; min-height: 40px; }
.tab[aria-selected="true"] { background: var(--lime); color: #1e1b26; }

.theory { display: grid; gap: 16px; padding-block: 20px; }
.theory h2 { font-size: clamp(20px, 5vw, 26px); }
.photo { margin: 0; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
.photo img { display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: cover; max-width: 100%; }
.photo figcaption { font-size: 12px; color: var(--muted); padding: 6px 12px; }
.tbody { display: grid; gap: 12px; max-width: 68ch; }
.tbody p, .tbody ul, .tbody ol { margin: 0; }
.tbody ul, .tbody ol { padding-left: 1.2em; display: grid; gap: 6px; }
.tbody h3 { font-size: 17px; font-weight: 700; margin-top: 6px; }
.tbody .lead { font-size: 17px; }
.tbody .note { font-size: 14px; color: var(--muted); }
.tbody i { font-style: italic; color: var(--violet-ink); }
.st { color: var(--violet-ink); font-weight: 800; text-decoration: underline 3px var(--lime); text-underline-offset: 3px; }
.hl { background: color-mix(in srgb, var(--lime) 45%, transparent); border-radius: 4px; padding: 0 2px; }
.scheme { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.scheme.flow { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.box { background: var(--bg); border: 1px solid var(--line); border-top: 4px solid var(--violet); border-radius: var(--r-sm); padding: 10px 12px; display: grid; gap: 4px; min-width: 0; overflow-wrap: anywhere; }
.box:nth-child(3n+2) { border-top-color: var(--lime); }
.box:nth-child(3n+3) { border-top-color: var(--yellow); }
.box b { font-family: var(--f-display); font-size: 16px; }
.box span { font-size: 13px; color: var(--muted); }
.box em { font-style: normal; font-size: 14px; }
.syl { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.syl span { font-family: var(--f-display); font-size: 26px; font-weight: 700; padding: 8px 14px; border-radius: var(--r-sm); background: var(--bg); border: 2px solid var(--line); }
.syl span.hit { border-color: var(--lime); background: color-mix(in srgb, var(--lime) 22%, var(--bg)); }
.cap { text-align: center; font-size: 14px; color: var(--muted); margin: 10px 0 0; }
.duo { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }
.half { border-radius: var(--r-sm); padding: 18px; text-align: center; font-family: var(--f-display); font-size: 22px; }
.half.dark { background: #1e1b26; color: #f4f1f9; }
.half.light { background: #fffbe6; color: #1e1b26; border: 1px solid #f7c915; }
.vs { font-size: 26px; color: var(--violet-ink); }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-sm); }
.tbl { border-collapse: collapse; width: 100%; font-size: 14px; }
.tbl th, .tbl td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { background: var(--surface-2); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td.w { color: var(--wrong); text-decoration: line-through; }
.tbl td.r { color: var(--right); font-weight: 700; }
.mg-pair { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.mg-chip { padding: 8px 14px; border-radius: var(--r-sm); font-weight: 700; }
.mg-chip--wrong { background: var(--wrong-bg); color: var(--wrong); text-decoration: line-through; text-decoration-thickness: 2px; }
.mg-chip--right { background: var(--right-bg); color: var(--right); }
.mg-arrow { color: var(--muted); font-size: 20px; }
.to-tasks { justify-self: start; }

/* ── Завдання ── */
.tasks { display: grid; gap: 14px; padding-block: 16px; }
.tprog { display: grid; gap: 8px; }
.tprog-top { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; flex-wrap: wrap; align-items: center; }
.score { font-family: var(--f-display); font-weight: 800; font-size: 20px; }
.map-toggle { justify-self: start; }
.grid100 { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; }
.cell { aspect-ratio: 1; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); font-family: var(--f-mono); font-size: 10px; display: grid; place-items: center; padding: 0; min-width: 0; color: var(--muted); }
.cell.c1 { background: var(--right-bg); border-color: var(--right); color: var(--right); font-weight: 700; }
.cell.c0 { background: var(--wrong-bg); border-color: var(--wrong); color: var(--wrong); font-weight: 700; }
.cell.cur { outline: 3px solid var(--violet); outline-offset: 1px; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; border: 1px solid var(--line); background: var(--surface); }
.legend .l1::before { background: var(--right-bg); border-color: var(--right); }
.legend .l0::before { background: var(--wrong-bg); border-color: var(--wrong); }

.task { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 14px; min-width: 0; }
.task-head { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.task-head .kind { color: var(--violet-ink); font-weight: 700; }
.task-q { font-family: var(--f-text); font-size: 18px; font-weight: 700; letter-spacing: 0; line-height: 1.35; }
.big { font-family: var(--f-display); font-size: clamp(20px, 5.6vw, 28px); font-weight: 700; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 14px; text-align: center; overflow-wrap: anywhere; line-height: 1.3; }
.gap { display: inline-block; min-width: 1.6em; border-bottom: 3px solid var(--lime); color: var(--violet-ink); text-align: center; line-height: 1; }
.opts { display: grid; gap: 8px; }
.opts.two { grid-template-columns: 1fr 1fr; }
.opt { text-align: left; border: 2px solid var(--line); background: var(--bg); border-radius: var(--r-sm); padding: 12px 14px; font-size: 17px; font-weight: 600; min-height: 50px; display: flex; gap: 10px; align-items: center; overflow-wrap: anywhere; min-width: 0; line-height: 1.35; }
.opt:hover:not(:disabled) { border-color: var(--violet); }
.opt .key { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-family: var(--f-mono); font-size: 13px; font-weight: 600; }
.opt .box-ic { flex: none; width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--line); display: grid; place-items: center; font-size: 14px; }
.opt.sel { border-color: var(--violet); background: color-mix(in srgb, var(--violet) 10%, var(--bg)); }
.opt.sel .box-ic { background: var(--violet); border-color: var(--violet); color: #fff; }
.opt.ok { border-color: var(--right); background: var(--right-bg); }
.opt.no { border-color: var(--wrong); background: var(--wrong-bg); }
.opt.miss { border-style: dashed; border-color: var(--right); }
.opt:disabled { cursor: default; color: inherit; }
.opt .tag { margin-left: auto; font-size: 12px; font-weight: 700; flex: none; }
.opt.ok .tag { color: var(--right); } .opt.no .tag { color: var(--wrong); }

.sort-list { display: grid; gap: 10px; }
.sort-item { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; display: grid; gap: 8px; min-width: 0; }
.sort-item .w { font-weight: 700; font-size: 17px; overflow-wrap: anywhere; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { min-width: 48px; border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 14px; min-height: 38px; }
.seg button.on { background: var(--violet); border-color: var(--violet); color: #fff; }
.seg button.ok { background: var(--right-bg); border-color: var(--right); color: var(--right); }
.seg button.no { background: var(--wrong-bg); border-color: var(--wrong); color: var(--wrong); }
.seg button:disabled { cursor: default; }

.match { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.match-col { display: grid; gap: 8px; align-content: start; min-width: 0; }
.match-col h4 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.mi { text-align: left; border: 2px solid var(--line); background: var(--bg); border-radius: var(--r-sm); padding: 10px 12px; font-weight: 600; font-size: 15px; display: flex; gap: 8px; align-items: center; min-height: 48px; overflow-wrap: anywhere; min-width: 0; line-height: 1.3; }
.mi .num { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-mono); font-size: 12px; background: var(--surface-2); }
.mi.picked { border-color: var(--violet); box-shadow: 0 0 0 3px color-mix(in srgb, var(--violet) 25%, transparent); }
.mi.p0 .num { background: var(--lime); color: #1e1b26; } .mi.p1 .num { background: var(--violet); color: #fff; }
.mi.p2 .num { background: var(--yellow); color: #1e1b26; } .mi.p3 .num { background: #4aa3c8; color: #fff; }
.mi.ok { border-color: var(--right); } .mi.no { border-color: var(--wrong); }
.mi:disabled { cursor: default; color: inherit; }

.order-line { min-height: 54px; border: 2px dashed var(--line); border-radius: var(--r-sm); padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: var(--bg); }
.order-line .ph { color: var(--muted); font-size: 14px; }
.pool { display: flex; flex-wrap: wrap; gap: 8px; }
.tok { border: 2px solid var(--line); background: var(--bg); border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 16px; min-height: 42px; }
.tok.in { background: color-mix(in srgb, var(--lime) 30%, var(--bg)); border-color: var(--lime); }
.tok.used { opacity: .3; }
.tok:disabled { cursor: default; color: inherit; }

.fb { border-radius: var(--r-sm); padding: 12px 14px; display: grid; gap: 6px; font-size: 15px; }
.fb.good { background: var(--right-bg); border: 1px solid var(--right); }
.fb.bad { background: var(--wrong-bg); border: 1px solid var(--wrong); }
.fb .verdict { font-weight: 800; font-family: var(--f-display); font-size: 15px; }
.fb.good .verdict { color: var(--right); } .fb.bad .verdict { color: var(--wrong); }
.task-nav { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.task-nav .grow { flex: 1 1 auto; justify-content: center; }
.foot-acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: space-between; align-items: center; }
.confirm { background: var(--wrong-bg); border: 1px solid var(--wrong); border-radius: var(--r-sm); padding: 12px; display: grid; gap: 8px; }
.gate { background: var(--surface); border: 2px dashed var(--yellow); border-radius: var(--r); padding: 18px; display: grid; gap: 10px; }
.done-card { background: color-mix(in srgb, var(--lime) 16%, var(--surface)); border: 1px solid var(--lime); border-radius: var(--r); padding: 16px; display: grid; gap: 8px; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: 14px; z-index: 50; max-width: calc(100% - 32px); text-align: center; }

@media (max-width: 560px) {
  .match { grid-template-columns: 1fr; }
  .opts.two { grid-template-columns: 1fr 1fr; }
  .task { padding: 14px 12px; }
  .opt { font-size: 16px; padding: 11px 12px; }
  .mark { width: 220px; }
  .mark--r { right: -120px; top: -70px; opacity: .08; }
  .mark--l { display: none; }
}
@media (prefers-reduced-motion: no-preference) { .bar i, .bar b { transition: width .3s ease; } }
</style>

</head>
<body>
<header class="hero">
  <img class="mark mark--r" src="img/mark-green-wave.png" alt="">
  <img class="mark mark--l" src="img/mark-purple-spiral.png" alt="">
  <div class="wrap">
    <div class="brand">
      <img class="logo" src="img/logo-wordmark.png" alt="Midgard">
      <div class="brand-tools">
        <span class="chip" id="sync-chip"><span class="dot"></span><span id="sync-text">Прогрес зберігається на цьому пристрої</span></span>
      </div>
    </div>
    <h1>Українська мова: <em>фонетика, орфографія, лексика</em></h1>
    <p class="sub">19 тем. У кожній є теорія з ілюстраціями і 100 завдань з автоматичною перевіркою. Кожне правильне завдання — це 1 %.</p>
    <div class="namebox" id="namebox">
      <label for="student-name">Ім’я та прізвище учня</label>
      <div class="namerow">
        <input id="student-name" type="text" autocomplete="name" placeholder="Наприклад: Олена Коваленко" maxlength="80">
        <button class="btn small primary" id="name-save">Зберегти</button>
      </div>
      <span class="hint" id="name-hint">Впишіть ім’я та прізвище, щоб виконувати завдання й надсилати результати вчителю.</span>
    </div>
    <div class="overall" id="overall"></div>
    <div class="who" id="who"><span>Учень: <b id="who-name"></b></span><button class="btn small ghost" id="who-change">Змінити</button></div>
  </div>
</header>

<div id="app"></div>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="engine.js"></script>
<script>
(function () {
  const T = window.TOPICS, S = window.SECTIONS, E = window.MGEngine, N = E.TOTAL;
  const $ = s => document.querySelector(s);
  const app = $("#app");
  const LS = "mg-ukr-trainer-v1";
  const EMPTY = ".".repeat(N);
  const TYPE = { one: "Оберіть одну відповідь", multi: "Кілька правильних відповідей", sort: "Розподіл за групами", match: "Встановіть відповідність", order: "Розташуйте в правильному порядку" };
  const IMG = { phonetics: "img/phonetics.jpg", ortho: "img/ortho.jpg", lexic: "img/lexic.jpg", foreign: "img/foreign.jpg", phraseo: "img/phraseo.jpg", compound: "img/compound.jpg", antonym: "img/antonym.jpg", error: "img/error.jpg" };
  const ALT = { phonetics: "Мікрофон на тлі звукових хвиль", ortho: "Зошит, ручка й маркер на столі", lexic: "Відкритий словник і лупа", foreign: "Книжки, глобус і паспорт", phraseo: "Керамічний кіт біля мішка на вишитому рушнику", compound: "Кубики, з яких складено місток", antonym: "Чорні й білі шахові фігури одна навпроти одної", error: "Червоний і зелений олівці на аркуші з текстом" };
  const TASKS = {};
  const tasksOf = id => TASKS[id] || (TASKS[id] = E.buildTasks(T.find(t => t.id === id)));
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  /* ───── Локальне сховище ───── */
  function loadStore() {
    try { const s = JSON.parse(localStorage.getItem(LS)); if (s && s.students) return s; } catch (e) {}
    return { current: "", students: {} };
  }
  let store = loadStore();
  function saveLocal() { try { localStorage.setItem(LS, JSON.stringify(store)); } catch (e) {} }
  const slugOf = n => n.trim().toLowerCase().replace(/\s+/g, " ").replace(/[^\p{L}\p{N} ’'-]/gu, "").replace(/[ ’'-]+/g, "_").slice(0, 80);
  const me = () => store.students[store.current] || null;
  function tstate(id) {
    const s = me(); if (!s) return null;
    if (!s.topics[id]) s.topics[id] = { r: EMPTY, ch: {} };
    if (!s.topics[id].ch) s.topics[id].ch = {};
    return s.topics[id];
  }
  function statsOf(r) { let a = 0, c = 0; for (const ch of r || "") { if (ch !== ".") a++; if (ch === "1") c++; } return { a, c }; }
  const topicStats = id => { const s = me(); return statsOf(s && s.topics[id] ? s.topics[id].r : EMPTY); };

  /* ───── UI-стан ───── */
  let ui = { view: "home", topic: null, tab: "theory", cur: 0, map: false };
  let pend = null, confirmReset = false;

  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => { t.hidden = true; }, 2600); }

  /* ───── Ім’я ───── */
  const nameInput = $("#student-name");
  function nameValid(n) { return n.trim().split(/\s+/).filter(Boolean).length >= 2; }
  function applyName() {
    const n = nameInput.value.trim().replace(/\s+/g, " ");
    if (!nameValid(n)) { $("#namebox").classList.add("need"); $("#name-hint").textContent = "Потрібні і ім’я, і прізвище (два слова)."; nameInput.focus(); return; }
    const slug = slugOf(n);
    if (!store.students[slug]) store.students[slug] = { name: n, topics: {} };
    else store.students[slug].name = n;
    const changed = store.current !== slug;
    store.current = slug; saveLocal(); refreshName(); if (changed) pullOwn();
    toast(changed ? "Вітаємо, " + n.split(" ")[0] + "! Можна працювати." : "Ім’я збережено.");
    pend = null; render(); scheduleSync(true);
  }
  function refreshName() {
    const s = me();
    if (s && document.activeElement !== nameInput) nameInput.value = s.name;
    $("#namebox").classList.toggle("need", !s);
    $("#name-hint").textContent = s ? "Результати записуються для: " + s.name + ". Інший учень на цьому пристрої — просто впишіть своє ім’я." : "Впишіть ім’я та прізвище, щоб виконувати завдання й надсилати результати вчителю.";
  }
  $("#name-save").addEventListener("click", applyName);
  $("#who-change").addEventListener("click", () => { ui.view = "home"; render(); window.scrollTo(0, 0); nameInput.focus(); nameInput.select(); });
  nameInput.addEventListener("keydown", e => { if (e.key === "Enter") applyName(); });

  /* ───── Надсилання результатів у Google Таблицю вчителя ───── */
  const RESULTS_URL = (window.MG_CONFIG && window.MG_CONFIG.resultsUrl || "").trim();
  let syncTimer = null, syncing = false, syncAgain = false;
  function setSync(mode) {
    const chip = $("#sync-chip"), txt = $("#sync-text");
    chip.classList.remove("ok", "bad");
    const M = {
      local: ["Прогрес зберігається на цьому пристрої", ""],
      ready: ["Результати надходять учителю", "ok"],
      saving: ["Надсилаю результат…", "ok"],
      saved: ["Результат надіслано вчителю", "ok"],
      error: ["Немає зв’язку — надішлю пізніше", "bad"]
    };
    const m = M[mode] || M.local; txt.textContent = m[0]; if (m[1]) chip.classList.add(m[1]);
    chip.title = mode === "local" ? "Учитель ще не підключив таблицю результатів. Звіт можна скопіювати внизу сторінки." : "";
  }
  function scheduleSync(now) {
    if (!RESULTS_URL || !me()) return;
    clearTimeout(syncTimer); syncTimer = setTimeout(pushNow, now ? 50 : 1500);
  }
  async function pushNow() {
    if (!RESULTS_URL || !me()) return;
    if (syncing) { syncAgain = true; return; }
    syncing = true; setSync("saving");
    const s = me(), rec = { key: store.current, name: s.name, topics: {} };
    for (const id in s.topics) rec.topics[id] = { r: s.topics[id].r };
    try {
      await fetch(RESULTS_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(rec) });
      setSync("saved");
    } catch (e) { setSync("error"); setTimeout(() => scheduleSync(true), 10000); }
    syncing = false;
    if (syncAgain) { syncAgain = false; scheduleSync(true); }
  }
  function mergeR(a, b) { let o = ""; for (let i = 0; i < N; i++) { const x = (a || EMPTY)[i] || ".", y = (b || EMPTY)[i] || "."; o += x !== "." ? x : y; } return o; }
  /* Підтягує збережений прогрес учня з таблиці (наприклад, якщо він перейшов на інший пристрій). */
  async function pullOwn() {
    if (!RESULTS_URL || !me()) return;
    try {
      const res = await fetch(RESULTS_URL + (RESULTS_URL.includes("?") ? "&" : "?") + "key=" + encodeURIComponent(store.current));
      const d = await res.json();
      if (!d || !d.ok || !d.topics) return;
      const loc = me();
      for (const id in d.topics) {
        const lt = loc.topics[id] || (loc.topics[id] = { r: EMPTY, ch: {} });
        lt.r = mergeR(lt.r, d.topics[id].r);
      }
      saveLocal(); render();
    } catch (e) {}
  }
  async function initSync() {
    if (!RESULTS_URL) { setSync("local"); return; }
    setSync("ready");
    await pullOwn(); scheduleSync(true);
  }

  /* ───── Рендер ───── */
  function renderOverall() {
    const s = me(); let a = 0, c = 0;
    T.forEach(t => { const st = statsOf(s && s.topics[t.id] ? s.topics[t.id].r : EMPTY); a += st.a; c += st.c; });
    const total = T.length * N;
    $("#overall").innerHTML = `<div class="overall-top"><span>Загальний прогрес: <b class="mono">${a}</b> з ${total} завдань</span><span>Правильно: <b class="mono">${c}</b> · <b class="mono">${(c / total * 100).toFixed(1)}%</b></span></div>
      <div class="bar" role="progressbar" aria-label="Загальний прогрес" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${a}"><b style="width:${a / total * 100}%"></b><i style="width:${c / total * 100}%"></i></div>`;
  }

  function render() {
    refreshName(); renderOverall();
    document.body.classList.toggle("compact", ui.view !== "home");
    const s0 = me(); $("#who-name").textContent = s0 ? s0.name : "не вказано";
    if (ui.view === "topic" && ui.topic) renderTopic();
    else renderHome();
  }

  function renderHome() {
    ui.view = "home";
    let h = '<main class="wrap">';
    S.forEach(sec => {
      h += `<section class="section"><div class="section-h"><span class="mono">${sec.id}</span><h2>${esc(sec.title)}</h2></div><div class="cards">`;
      T.filter(t => t.sec === sec.id).forEach(t => {
        const st = topicStats(t.id);
        h += `<article class="card"><h3>${esc(t.title)}</h3>
          <div class="bar" aria-hidden="true"><b style="width:${st.a}%"></b><i style="width:${st.c}%"></i></div>
          <div class="meta"><span>Виконано <b class="mono">${st.a}</b>/100</span><span>Результат <b class="mono">${st.c}%</b> ${st.c === 100 ? '<span class="badge100">100%</span>' : ""}</span></div>
          <div class="acts"><button class="btn small" data-open="${t.id}" data-tab="theory">Теорія</button><button class="btn small primary" data-open="${t.id}" data-tab="tasks">${st.a ? (st.a === 100 ? "Переглянути" : "Продовжити") : "Почати"}</button></div></article>`;
      });
      h += "</div></section>";
    });
    const s = me();
    h += `<section class="report"><h2 style="font-size:16px">Звіт для вчителя</h2>
      <p class="hint" style="margin:0">Результати надходять у таблицю вчителя автоматично. Якщо немає інтернету або таблицю ще не підключено, скопіюйте звіт і надішліть учителю.</p>
      <div><button class="btn small" id="copy-report" ${s ? "" : "disabled"}>Скопіювати звіт</button></div>
      <textarea id="report-text" readonly hidden></textarea></section>`;
    h += "</main>";
    app.innerHTML = h;
  }
  function reportText() {
    const s = me(); if (!s) return "";
    const lines = ["Учень: " + s.name, "Дата: " + new Date().toLocaleString("uk-UA"), ""];
    let tc = 0;
    T.forEach(t => { const st = topicStats(t.id); tc += st.c; lines.push(t.sec + " " + t.title + ": " + st.c + "% (виконано " + st.a + "/100)"); });
    lines.push("", "Разом: " + tc + " з " + T.length * N + " (" + (tc / (T.length * N) * 100).toFixed(1) + "%)");
    return lines.join("\n");
  }

  function renderTopic() {
    const t = T.find(x => x.id === ui.topic); if (!t) { ui.view = "home"; return renderHome(); }
    let h = `<div class="topbar"><div class="wrap">
      <div class="tb-row"><button class="btn small ghost" data-act="home" aria-label="До списку тем">← Теми</button><span class="tb-title">${t.sec} · ${esc(t.title)}</span></div>
      <div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="${ui.tab === "theory"}" data-tabto="theory">Теорія</button><button class="tab" role="tab" aria-selected="${ui.tab === "tasks"}" data-tabto="tasks">Завдання</button></div>
    </div></div><main class="wrap" style="padding-top:0">`;
    h += ui.tab === "theory" ? theoryHtml(t) : tasksHtml(t);
    h += "</main>";
    app.innerHTML = h;
  }

  function theoryHtml(t) {
    return `<article class="theory">
      <h2>${esc(t.title)}</h2>
      <figure class="photo"><img src="${IMG[t.img]}" alt="${esc(ALT[t.img])}" loading="lazy"><figcaption>Ілюстрацію згенеровано ШІ (Hugging Face, Z-Image Turbo)</figcaption></figure>
      <div class="tbody">${t.theory}</div>
      <button class="btn primary to-tasks" data-tabto="tasks">До завдань →</button>
    </article>`;
  }

  function tasksHtml(t) {
    const s = me();
    if (!s) return `<section class="tasks"><div class="gate"><h3 style="font-size:17px">Спершу впишіть ім’я та прізвище</h3><p style="margin:0">Так учитель побачить, чиї це результати. Поле — угорі сторінки.</p><div><button class="btn primary" data-act="focus-name">Вписати ім’я</button></div></div></section>`;
    const st = tstate(t.id), tasks = tasksOf(t.id), stat = statsOf(st.r);
    if (ui.cur < 0 || ui.cur >= N) ui.cur = 0;
    let h = `<section class="tasks"><div class="tprog">
      <div class="tprog-top"><span>Виконано <b class="mono">${stat.a}</b> з 100</span><span class="score mono">${stat.c}%</span></div>
      <div class="bar" role="progressbar" aria-label="Прогрес теми" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${stat.a}"><b style="width:${stat.a}%"></b><i style="width:${stat.c}%"></i></div>
      <button class="btn small ghost map-toggle" data-act="map" aria-expanded="${ui.map}">${ui.map ? "Сховати карту завдань ▲" : "Карта завдань ▼"}</button>`;
    if (ui.map) {
      h += '<div class="grid100">';
      for (let i = 0; i < N; i++) { const c = st.r[i]; h += `<button class="cell ${c === "1" ? "c1" : c === "0" ? "c0" : ""} ${i === ui.cur ? "cur" : ""}" data-go="${i}" aria-label="Завдання ${i + 1}">${i + 1}</button>`; }
      h += '</div><div class="legend"><span class="l1">правильно</span><span class="l0">помилка</span><span>не виконано</span></div>';
    }
    h += "</div>";
    if (stat.a === N && !ui.reviewing) {
      h += `<div class="done-card"><h3 style="font-size:18px">Тему завершено: ${stat.c}%</h3><p style="margin:0">${stat.c === 100 ? "Бездоганно! Усі 100 завдань правильно." : "Помилки можна розібрати в карті завдань. Щоб покращити результат, почніть тему заново."}</p>
        <div class="task-nav"><button class="btn" data-act="review">Переглянути відповіді</button><button class="btn" data-act="home">До тем</button></div></div>`;
    } else h += taskCard(t, tasks[ui.cur], st);
    h += `<div class="foot-acts"><button class="btn small" data-act="finish">Завершити й вийти</button><button class="btn small ghost" data-act="reset">Почати тему заново</button></div>`;
    if (confirmReset) h += `<div class="confirm"><b>Почати тему заново?</b><span>Усі відповіді цієї теми буде стерто, результат стане 0%.</span><div class="task-nav"><button class="btn danger" data-act="reset-yes">Так, стерти</button><button class="btn" data-act="reset-no">Скасувати</button></div></div>`;
    return h + "</section>";
  }

  function taskCard(t, task, st) {
    const i = task.n, done = st.r[i] !== ".", resp = done ? st.ch[i] : undefined;
    if (!pend || pend.i !== i || pend.topic !== t.id) pend = newPend(task, t.id);
    let h = `<article class="task" aria-live="polite"><div class="task-head"><span class="mono">Завдання ${i + 1} / 100</span><span class="kind">${TYPE[task.t]}</span></div>
      <h3 class="task-q">${task.q}</h3>${task.big ? `<div class="big">${task.big}</div>` : ""}`;
    h += bodyHtml(task, done, resp);
    if (done) {
      const ok = st.r[i] === "1";
      h += `<div class="fb ${ok ? "good" : "bad"}"><span class="verdict">${ok ? "Правильно! +1%" : "Помилка"}</span>${!ok ? correctHtml(task) : ""}${task.note ? `<span>${task.note}</span>` : ""}</div>`;
    }
    const canCheck = !done && task.t !== "one" && ready(task);
    h += `<div class="task-nav"><button class="btn" data-act="prev" ${i === 0 ? "disabled" : ""} aria-label="Попереднє завдання">←</button>`;
    if (!done && task.t !== "one") h += `<button class="btn primary grow" data-act="check" ${canCheck ? "" : "disabled"}>Перевірити</button>`;
    else if (done) h += `<button class="btn primary grow" data-act="next-open">${nextOpen(st, i) >= 0 ? "Далі →" : "Готово"}</button>`;
    else h += `<span class="hint" style="align-self:center">Торкніться відповіді</span>`;
    h += `<button class="btn" data-act="next" ${i === N - 1 ? "disabled" : ""} aria-label="Наступне завдання (пропустити)">→</button></div></article>`;
    return h;
  }
  function correctHtml(task) {
    if (task.t === "one") return `<span>Правильна відповідь: <b>${task.opts[task.a]}</b></span>`;
    if (task.t === "order") return `<span>Правильний порядок: <b>${task.items.map(esc).join(" ")}</b></span>`;
    return "";
  }
  function newPend(task, topic) {
    const p = { i: task.n, topic };
    if (task.t === "multi") p.v = [];
    if (task.t === "sort") p.v = task.items.map(() => null);
    if (task.t === "match") { p.v = task.left.map(() => null); p.sel = null; }
    if (task.t === "order") { p.v = []; p.pool = E.shuffle(E.rngFrom("ord" + topic + task.n), task.items.map((_, k) => k)); }
    return p;
  }
  function ready(task) {
    if (task.t === "multi") return pend.v.length > 0;
    if (task.t === "sort" || task.t === "match") return pend.v.every(v => v !== null);
    if (task.t === "order") return pend.v.length === task.items.length;
    return false;
  }
  function bodyHtml(task, done, resp) {
    const dis = done ? "disabled" : "";
    if (task.t === "one") {
      const two = task.opts.length === 2 && task.opts.every(o => o.length < 24);
      return `<div class="opts ${two ? "two" : ""}">` + task.opts.map((o, k) => {
        let cls = "", tag = "";
        if (done) { if (k === task.a) { cls = "ok"; tag = "✓"; } else if (k === resp) { cls = "no"; tag = "✗"; } }
        return `<button class="opt ${cls}" data-one="${k}" ${dis}>${two ? "" : `<span class="key">${"АБВГДЕ"[k]}</span>`}<span>${o}</span>${tag ? `<span class="tag">${tag}</span>` : ""}</button>`;
      }).join("") + "</div>";
    }
    if (task.t === "multi") {
      const chosen = done ? (resp || []) : pend.v;
      return '<div class="opts">' + task.opts.map((o, k) => {
        const on = chosen.includes(k), right = task.a.includes(k);
        let cls = on ? "sel" : "", tag = "";
        if (done) { cls = right && on ? "ok" : on ? "no" : right ? "miss" : ""; tag = right && on ? "✓" : on ? "✗" : right ? "пропущено" : ""; }
        return `<button class="opt ${cls}" data-multi="${k}" aria-pressed="${on}" ${dis}><span class="box-ic">${on ? "✓" : ""}</span><span>${o}</span>${tag ? `<span class="tag">${tag}</span>` : ""}</button>`;
      }).join("") + "</div>";
    }
    if (task.t === "sort") {
      const v = done ? (resp || []) : pend.v;
      return '<div class="sort-list">' + task.items.map((it, k) => `<div class="sort-item"><span class="w">${it.html}</span><div class="seg" role="group">` +
        task.cats.map((c, ci) => {
          let cls = v[k] === ci ? "on" : "";
          if (done) cls = ci === it.c ? (v[k] === ci ? "ok" : "ok") : v[k] === ci ? "no" : "";
          if (done && ci === it.c && v[k] !== ci) cls = "ok";
          return `<button class="${cls}" data-sort="${k}:${ci}" aria-pressed="${v[k] === ci}" ${dis}>${c}</button>`;
        }).join("") + "</div></div>").join("") + "</div>";
    }
    if (task.t === "match") {
      const v = done ? (resp || task.left.map(() => null)) : pend.v;
      let h = '<div class="match"><div class="match-col"><h4>Ліворуч — оберіть</h4>';
      task.left.forEach((l, k) => {
        const paired = v[k] !== null && v[k] !== undefined;
        let cls = paired ? "p" + k : ""; if (!done && pend.sel === k) cls += " picked";
        if (done) cls += task.right[v[k]] && task.right[v[k]].li === k ? " ok" : " no";
        h += `<button class="mi ${cls}" data-ml="${k}" ${dis}><span class="num">${k + 1}</span><span>${l}</span></button>`;
      });
      h += '</div><div class="match-col"><h4>Праворуч — поєднайте</h4>';
      task.right.forEach((r, k) => {
        const owner = v.indexOf(k);
        let cls = owner >= 0 ? "p" + owner : "";
        if (done) cls += r.li === owner ? " ok" : " no";
        h += `<button class="mi ${cls}" data-mr="${k}" ${dis}><span class="num">${owner >= 0 ? owner + 1 : "·"}</span><span>${r.html}</span></button>`;
      });
      h += "</div></div>";
      if (done) h += '<span class="hint">Номер праворуч показує, з чим ви поєднали. Правильні пари — у поясненні нижче.</span>';
      else h += '<span class="hint">Торкніться слова ліворуч, а потім відповідного варіанта праворуч. Повторне торкання знімає пару.</span>';
      return h;
    }
    if (task.t === "order") {
      const v = done ? (resp || []) : pend.v;
      let h = '<div class="order-line">' + (v.length ? v.map((k, pos) => `<button class="tok in" data-unord="${pos}" ${dis}>${esc(task.items[k])}</button>`).join("") : '<span class="ph">Торкайтеся частин нижче по черзі</span>') + "</div>";
      if (!done) h += '<div class="pool">' + pend.pool.map(k => `<button class="tok ${v.includes(k) ? "used" : ""}" data-ord="${k}" ${v.includes(k) ? "disabled" : ""}>${esc(task.items[k])}</button>`).join("") + "</div>";
      return h;
    }
    return "";
  }
  function nextOpen(st, from) {
    for (let k = 1; k <= N; k++) { const j = (from + k) % N; if (st.r[j] === ".") return j; }
    return -1;
  }
  function answer(t, task, resp) {
    const st = tstate(t.id);
    if (st.r[task.n] !== ".") return;
    const ok = E.check(task, resp);
    st.r = st.r.slice(0, task.n) + (ok ? "1" : "0") + st.r.slice(task.n + 1);
    st.ch[task.n] = resp;
    pend = null; saveLocal(); scheduleSync(); render();
  }

  function copyText(text, fallbackEl) {
    const done = () => toast("Скопійовано");
    const fail = () => { if (fallbackEl) { fallbackEl.hidden = false; fallbackEl.value = text; fallbackEl.focus(); fallbackEl.select(); toast("Виділено — скопіюйте вручну"); } };
    try { navigator.clipboard.writeText(text).then(done, fail); } catch (e) { fail(); }
  }

  /* ───── Події ───── */
  app.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    const d = b.dataset;
    if (d.open) { ui = Object.assign(ui, { view: "topic", topic: d.open, tab: d.tab, reviewing: false }); confirmReset = false; pend = null; jumpFirst(); render(); window.scrollTo(0, 0); return; }
    if (d.tabto) { ui.tab = d.tabto; if (d.tabto === "tasks") jumpFirst(); render(); window.scrollTo(0, 0); return; }
    if (b.id === "copy-report") { copyText(reportText(), $("#report-text")); return; }
    const act = d.act;
    if (act === "home") { ui.view = "home"; confirmReset = false; render(); window.scrollTo(0, 0); return; }
    if (act === "focus-name") { ui.view = "home"; render(); window.scrollTo(0, 0); nameInput.focus(); return; }
    if (act === "finish") { ui.view = "home"; render(); window.scrollTo(0, 0); toast("Прогрес збережено. Повернутися можна будь-коли."); return; }
    if (act === "reset") { confirmReset = true; render(); return; }
    if (act === "reset-no") { confirmReset = false; render(); return; }
    if (act === "reset-yes") { const s = me(); if (s) { s.topics[ui.topic] = { r: EMPTY, ch: {} }; saveLocal(); scheduleSync(true); } confirmReset = false; ui.cur = 0; ui.reviewing = false; pend = null; render(); toast("Тему почато заново"); return; }
    if (act === "map") { ui.map = !ui.map; render(); return; }
    if (act === "review") { ui.reviewing = true; ui.cur = 0; ui.map = true; render(); return; }
    if (d.go !== undefined) { ui.cur = +d.go; ui.reviewing = true; pend = null; render(); scrollTask(); return; }
    if (act === "prev") { ui.cur = Math.max(0, ui.cur - 1); ui.reviewing = true; pend = null; render(); scrollTask(); return; }
    if (act === "next") { ui.cur = Math.min(N - 1, ui.cur + 1); ui.reviewing = true; pend = null; render(); scrollTask(); return; }
    if (act === "next-open") { const st = tstate(ui.topic), j = nextOpen(st, ui.cur); if (j < 0) { ui.reviewing = false; } else ui.cur = j; pend = null; render(); scrollTask(); return; }
    const t = T.find(x => x.id === ui.topic); if (!t || !me()) return;
    const task = tasksOf(t.id)[ui.cur];
    if (d.one !== undefined) { answer(t, task, +d.one); return; }
    if (d.multi !== undefined) { const k = +d.multi, ix = pend.v.indexOf(k); if (ix >= 0) pend.v.splice(ix, 1); else pend.v.push(k); render(); return; }
    if (d.sort) { const [k, c] = d.sort.split(":").map(Number); pend.v[k] = c; render(); return; }
    if (d.ml !== undefined) { const k = +d.ml; if (pend.v[k] !== null) { pend.v[k] = null; pend.sel = k; } else pend.sel = k; render(); return; }
    if (d.mr !== undefined) {
      const r = +d.mr, owner = pend.v.indexOf(r);
      if (owner >= 0) { pend.v[owner] = null; render(); return; }
      let sel = pend.sel; if (sel === null) sel = pend.v.indexOf(null);
      if (sel >= 0) { pend.v[sel] = r; pend.sel = null; const nx = pend.v.indexOf(null); if (nx >= 0 && pend.sel === null) pend.sel = nx; }
      render(); return;
    }
    if (d.ord !== undefined) { pend.v.push(+d.ord); render(); return; }
    if (d.unord !== undefined) { pend.v.splice(+d.unord, 1); render(); return; }
    if (act === "check") { if (!ready(task)) return; answer(t, task, task.t === "multi" ? pend.v.slice().sort((a, b) => a - b) : pend.v.slice()); return; }
  });
  function jumpFirst() {
    if (!me() || !ui.topic) return;
    const st = tstate(ui.topic), j = st.r.indexOf(".");
    ui.cur = j >= 0 ? j : 0; ui.reviewing = false;
  }
  function scrollTask() { const el = document.querySelector(".task"); if (el && el.getBoundingClientRect().top < 60) el.scrollIntoView({ block: "start" }); }

  render();
  initSync();
})();
</script>

</body>
</html>
