<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Тренажер з української мови: фонетика, орфографія, лексика. Теорія та 100 завдань з кожної теми.">
<title>Мовний тренажер Midgard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
[hidden] { display: none !important; }
/* Layout: одна центральна колонка (макс. 860px) — шапка з ім’ям, картки тем, екран теми з вкладками «Теорія / Завдання». */
:root {
  --lime: #99cc00; --violet: #9d6bdb; --yellow: #f7c915;
  --stress: #d0105c; --stress-bg: #ffe0ec;
  --wrong: #c13f2c; --right: #3f7a16;
  --bg: #ffffff; --surface: #faf8fc; --surface-2: #f2eef8; --line: #e5e0ee; --text: #1e1b26;
  --muted: color-mix(in srgb, var(--text) 62%, transparent);
  --lime-ink: #3f6a00; --violet-ink: #6b3fb0;
  --right-bg: color-mix(in srgb, var(--right) 13%, transparent);
  --wrong-bg: color-mix(in srgb, var(--wrong) 12%, transparent);
  --f-display: 'Unbounded', 'Rubik', system-ui, sans-serif;
  --f-text: 'Manrope', 'PT Sans', 'Fira Sans', system-ui, sans-serif;
  --f-mono: 'JetBrains Mono', 'PT Mono', ui-monospace, monospace;
  --r: 18px; --r-sm: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12101a; --surface: #1b1826; --surface-2: #231f31; --line: #332d44; --text: #f4f1f9;
  --wrong: #ff7a5e; --right: #a5d914; --lime-ink: #b8e63a; --violet-ink: #c4a3f0; color-scheme: dark;
  --stress: #ff7aa8; --stress-bg: #4a1730;
} }
:root[data-theme="dark"] {
  --bg: #12101a; --surface: #1b1826; --surface-2: #231f31; --line: #332d44; --text: #f4f1f9;
  --wrong: #ff7a5e; --right: #a5d914; --lime-ink: #b8e63a; --violet-ink: #c4a3f0; color-scheme: dark;
  --stress: #ff7aa8; --stress-bg: #4a1730;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--f-text); font-size: 16px; line-height: 1.55; overflow-x: hidden; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; letter-spacing: -0.01em; text-wrap: balance; margin: 0; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.wrap { max-width: 860px; margin: 0 auto; padding-inline: 16px; }

/* ── Шапка ── */
.hero { position: relative; overflow: hidden; overflow: clip; border-bottom: 1px solid var(--line); background: var(--surface); }
.mark { position: absolute; pointer-events: none; user-select: none; opacity: .11; z-index: 0; width: 300px; max-width: none; }
.mark--r { right: -150px; top: -60px; }
.mark--l { left: -170px; bottom: -150px; opacity: .09; }
.hero .wrap { position: relative; z-index: 1; padding-block: 20px 18px; display: grid; gap: 14px; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: nowrap; min-width: 0; }
.logo { width: clamp(132px, 34vw, 170px); height: auto; display: block; flex: none; }
.brand-tools { display: flex; gap: 8px; align-items: center; min-width: 0; }
#sync-chip { white-space: nowrap; min-width: 0; max-width: 100%; height: 30px; }
#sync-text { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.hero h1 { font-size: clamp(22px, 5.4vw, 32px); font-weight: 800; }
.hero h1 em { font-style: normal; background: linear-gradient(transparent 62%, color-mix(in srgb, var(--lime) 55%, transparent) 62%); }
.sub { margin: 0; color: var(--muted); max-width: 62ch; }
.namebox { display: grid; gap: 6px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.namebox label { font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.namerow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.namebox.need { border-color: var(--yellow); border-width: 2px; }
.ptabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--surface-2); padding: 4px; border-radius: 999px; }
.pform { display: grid; gap: 10px; margin: 0; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 10px; }
.pgrid label { display: grid; gap: 4px; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); min-width: 0; }
.pgrid input { width: 100%; min-width: 0; border: 2px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; background: var(--surface); font-size: 17px; font-weight: 600; text-transform: none; letter-spacing: 0; color: var(--text); }
.pgrid input:focus { border-color: var(--lime); outline: none; }
.pname { font-weight: 800; font-size: 17px; flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.hint.bad { color: var(--wrong); font-weight: 700; }
.hint { font-size: 13px; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); white-space: normal; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--yellow); flex: none; }
.chip.ok .dot { background: var(--lime); }
.chip.bad .dot { background: var(--wrong); }
.overall { display: grid; gap: 6px; }
.overall-top { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; flex-wrap: wrap; }
.bar { height: 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; position: relative; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--lime); border-radius: 999px; }
.bar b { position: absolute; inset: 0 auto 0 0; background: color-mix(in srgb, var(--violet) 35%, transparent); border-radius: 999px; }

.who { display: none; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; }
body.compact .who { display: flex; }
body.compact .hero h1, body.compact .sub, body.compact .namebox, body.compact .overall { display: none; }
body.compact .hero .wrap { padding-block: 10px; gap: 8px; }
body.compact .logo { width: 132px; }
/* ── Кнопки ── */
.btn { border: 2px solid var(--line); background: var(--bg); border-radius: 999px; padding: 9px 16px; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; }
.btn:hover { border-color: var(--violet); }
.btn.primary { background: var(--lime); border-color: var(--lime); color: #1e1b26; }
.btn.primary:hover { filter: brightness(1.05); border-color: var(--lime); }
.btn.primary:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.btn.ghost { border-color: transparent; background: transparent; padding-inline: 10px; }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 14px; }
.btn.danger { border-color: var(--wrong); color: var(--wrong); }

/* ── Список тем ── */
main { padding-block: 22px 60px; }
.section { display: grid; gap: 12px; margin-bottom: 28px; }
.section-h { display: flex; align-items: baseline; gap: 10px; }
.section-h .mono { color: var(--violet-ink); font-weight: 600; }
.section-h h2 { font-size: 18px; font-weight: 700; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.card h3 { font-size: 15px; font-weight: 700; font-family: var(--f-text); letter-spacing: 0; line-height: 1.3; }
.card .meta { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.card .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.card .acts .btn { flex: 1 1 auto; justify-content: center; }
.badge100 { font-size: 12px; font-weight: 800; color: #1e1b26; background: var(--yellow); border-radius: 999px; padding: 2px 8px; }
.report { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 8px; }
.report textarea { width: 100%; min-height: 120px; font-family: var(--f-mono); font-size: 12px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--bg); color: var(--text); padding: 8px; }

/* ── Екран теми ── */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.topbar .wrap { display: grid; gap: 8px; padding-block: 10px; }
.tb-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.tb-row .btn { flex: none; white-space: nowrap; }
.tb-title { font-family: var(--f-display); font-weight: 700; font-size: 15px; line-height: 1.2; min-width: 0; overflow-wrap: anywhere; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--surface-2); padding: 4px; border-radius: 999px; }
.tab { border: 0; background: transparent; border-radius: 999px; padding: 8px 10px; font-weight: 700; min-height: 40px; }
.tab[aria-selected="true"] { background: var(--lime); color: #1e1b26; }

.theory { display: grid; gap: 16px; padding-block: 20px; }
.theory h2 { font-size: clamp(20px, 5vw, 26px); }
.photo { margin: 0; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
.photo img { display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: cover; max-width: 100%; }
.photo figcaption { font-size: 12px; color: var(--muted); padding: 6px 12px; }
.tbody { display: grid; gap: 12px; max-width: 68ch; }
.tbody p, .tbody ul, .tbody ol { margin: 0; }
.tbody ul, .tbody ol { padding-left: 1.2em; display: grid; gap: 6px; }
.tbody h3 { font-size: 17px; font-weight: 700; margin-top: 6px; }
.tbody .lead { font-size: 17px; }
.tbody .note { font-size: 14px; color: var(--muted); }
.tbody i { font-style: italic; color: var(--violet-ink); }
/* Наголошена (виділена) літера: яскравий колір, тло й товсте підкреслення — однаково в тренажері, ЗНО й НМТ. */
.st { color: var(--stress); background: var(--stress-bg); font-weight: 900; font-style: normal; border-radius: 3px; padding: 0 1px; text-decoration: underline 3px var(--stress); text-underline-offset: 4px; text-decoration-skip-ink: none; }
.st b, .st i { font-style: normal; }
.hl { background: color-mix(in srgb, var(--lime) 45%, transparent); border-radius: 4px; padding: 0 2px; }
/* Граматична основа: підмет — одна лінія, присудок — дві; тире між ними виділене. */
.u1 { text-decoration: underline 2px var(--violet); text-underline-offset: 4px; text-decoration-skip-ink: none; }
.u2 { text-decoration: underline double 2px var(--violet); text-underline-offset: 4px; text-decoration-skip-ink: none; }
.dash { color: var(--right); font-weight: 900; }
.scheme { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.scheme.flow { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.box { background: var(--bg); border: 1px solid var(--line); border-top: 4px solid var(--violet); border-radius: var(--r-sm); padding: 10px 12px; display: grid; gap: 4px; min-width: 0; overflow-wrap: anywhere; }
.box:nth-child(3n+2) { border-top-color: var(--lime); }
.box:nth-child(3n+3) { border-top-color: var(--yellow); }
.box b { font-family: var(--f-display); font-size: 16px; }
.box span { font-size: 13px; color: var(--muted); }
.box em { font-style: normal; font-size: 14px; }
.syl { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.syl span { font-family: var(--f-display); font-size: 26px; font-weight: 700; padding: 8px 14px; border-radius: var(--r-sm); background: var(--bg); border: 2px solid var(--line); }
.syl span.hit { border-color: var(--lime); background: color-mix(in srgb, var(--lime) 22%, var(--bg)); }
.cap { text-align: center; font-size: 14px; color: var(--muted); margin: 10px 0 0; }
.duo { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }
.half { border-radius: var(--r-sm); padding: 18px; text-align: center; font-family: var(--f-display); font-size: 22px; }
.half.dark { background: #1e1b26; color: #f4f1f9; }
.half.light { background: #fffbe6; color: #1e1b26; border: 1px solid #f7c915; }
.vs { font-size: 26px; color: var(--violet-ink); }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-sm); }
.tbl { border-collapse: collapse; width: 100%; font-size: 14px; }
.tbl th, .tbl td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { background: var(--surface-2); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td.w { color: var(--wrong); text-decoration: line-through; }
.tbl td.r { color: var(--right); font-weight: 700; }
.mg-pair { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.mg-chip { padding: 8px 14px; border-radius: var(--r-sm); font-weight: 700; }
.mg-chip--wrong { background: var(--wrong-bg); color: var(--wrong); text-decoration: line-through; text-decoration-thickness: 2px; }
.mg-chip--right { background: var(--right-bg); color: var(--right); }
.mg-arrow { color: var(--muted); font-size: 20px; }
.to-tasks { justify-self: start; }
.syl-pair { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }
.syl-col { display: grid; gap: 6px; justify-items: center; text-align: center; }
.syl-col em { font-style: normal; font-family: var(--f-display); font-weight: 700; color: var(--violet-ink); }
.syl-tag { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.syl-arrow { font-size: 24px; color: var(--muted); }
.algo { list-style: none; counter-reset: step; padding: 0; margin: 0; display: grid; gap: 8px; }
.algo li { counter-increment: step; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 2px 10px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; }
.algo li::before { content: counter(step); grid-row: span 2; width: 28px; height: 28px; border-radius: 50%; background: var(--lime); color: #1e1b26; font: 800 14px var(--f-display); display: grid; place-items: center; }
.algo li b { font-size: 15px; }
.algo li span { font-size: 14px; color: var(--muted); }
.fork { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.fork-q { background: var(--surface-2); padding: 10px 14px; font-size: 15px; text-align: center; }
.fork-a { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.fork-b { padding: 12px 14px; display: grid; gap: 4px; min-width: 0; }
.fork-b b { font-family: var(--f-display); font-size: 15px; }
.fork-b span { font-size: 14px; font-style: italic; color: var(--violet-ink); }
.fork-soft { border-top: 4px solid var(--lime); }
.fork-hard { border-top: 4px solid var(--violet); }
.nolist { padding-left: 1.2em; }
.trees { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
.tree { width: 100%; max-width: 280px; height: auto; display: block; justify-self: center; }
.triads { display: grid; gap: 8px; }
.triad { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--yellow); border-radius: var(--r-sm); padding: 10px 12px; }
.triad em { flex-basis: 100%; font-style: italic; font-size: 14px; color: var(--violet-ink); }
.tri-in, .tri-out { font-family: var(--f-display); font-weight: 700; font-size: 16px; }
.tri-in b, .tri-out b { color: var(--right); text-decoration: underline 3px var(--lime); text-underline-offset: 3px; }
.tri-arrow { color: var(--muted); font-size: 18px; }
.assim-pairs { display: grid; gap: 10px; }
.assim-legend { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
.assim-legend span { display: flex; gap: 8px; align-items: baseline; }
.lg { flex: none; width: 12px; height: 12px; border-radius: 3px; display: inline-block; transform: translateY(1px); }
.lg-up { background: var(--lime); } .lg-down { background: var(--violet); }

/* ── Завдання ── */
.tasks { display: grid; gap: 14px; padding-block: 16px; }
.tprog { display: grid; gap: 8px; }
.tprog-top { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; flex-wrap: wrap; align-items: center; }
.score { font-family: var(--f-display); font-weight: 800; font-size: 20px; }
.map-toggle { justify-self: start; }
.grid100 { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; }
.cell { aspect-ratio: 1; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); font-family: var(--f-mono); font-size: 10px; display: grid; place-items: center; padding: 0; min-width: 0; color: var(--muted); }
.cell.c1 { background: var(--right-bg); border-color: var(--right); color: var(--right); font-weight: 700; }
.cell.c0 { background: var(--wrong-bg); border-color: var(--wrong); color: var(--wrong); font-weight: 700; }
.cell.cur { outline: 3px solid var(--violet); outline-offset: 1px; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; border: 1px solid var(--line); background: var(--surface); }
.legend .l1::before { background: var(--right-bg); border-color: var(--right); }
.legend .l0::before { background: var(--wrong-bg); border-color: var(--wrong); }

.task { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 14px; min-width: 0; }
.task-head { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.task-head .kind { color: var(--violet-ink); font-weight: 700; }
.task-q { font-family: var(--f-text); font-size: 18px; font-weight: 700; letter-spacing: 0; line-height: 1.35; }
.big { font-family: var(--f-display); font-size: clamp(20px, 5.6vw, 28px); font-weight: 700; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 14px; text-align: center; overflow-wrap: anywhere; line-height: 1.3; }
.gap { display: inline-block; min-width: 1.6em; border-bottom: 3px solid var(--lime); color: var(--violet-ink); text-align: center; line-height: 1; }
.opts { display: grid; gap: 8px; }
.opts.two { grid-template-columns: 1fr 1fr; }
.opt { text-align: left; border: 2px solid var(--line); background: var(--bg); border-radius: var(--r-sm); padding: 12px 14px; font-size: 17px; font-weight: 600; min-height: 50px; display: flex; gap: 10px; align-items: center; overflow-wrap: anywhere; min-width: 0; line-height: 1.35; }
.opt:hover:not(:disabled) { border-color: var(--violet); }
.opt .key { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-family: var(--f-mono); font-size: 13px; font-weight: 600; }
.opt .box-ic { flex: none; width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--line); display: grid; place-items: center; font-size: 14px; }
.opt.sel { border-color: var(--violet); background: color-mix(in srgb, var(--violet) 10%, var(--bg)); }
.opt.sel .box-ic { background: var(--violet); border-color: var(--violet); color: #fff; }
.opt.sel .key { background: var(--violet); color: #fff; }
.opt.sel { box-shadow: 0 0 0 3px color-mix(in srgb, var(--violet) 25%, transparent); }
.opt.ok { border-color: var(--right); background: var(--right-bg); }
.opt.no { border-color: var(--wrong); background: var(--wrong-bg); }
.opt.miss { border-style: dashed; border-color: var(--right); }
.opt:disabled { cursor: default; color: inherit; }
.opt .ln { display: block; }
.opt .ln + .ln { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
.opt .tag { margin-left: auto; font-size: 12px; font-weight: 700; flex: none; }
.opt.ok .tag { color: var(--right); } .opt.no .tag { color: var(--wrong); }

.sort-list { display: grid; gap: 10px; }
.sort-item { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; display: grid; gap: 8px; min-width: 0; }
.sort-item .w { font-weight: 700; font-size: 17px; overflow-wrap: anywhere; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { min-width: 48px; border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 14px; min-height: 38px; }
.seg button.on { background: var(--violet); border-color: var(--violet); color: #fff; }
.seg button.ok { background: var(--right-bg); border-color: var(--right); color: var(--right); }
.seg button.no { background: var(--wrong-bg); border-color: var(--wrong); color: var(--wrong); }
.seg button:disabled { cursor: default; }

.match { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.match-col { display: grid; gap: 8px; align-content: start; min-width: 0; }
.match-col h4 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.mi { text-align: left; border: 2px solid var(--line); background: var(--bg); border-radius: var(--r-sm); padding: 10px 12px; font-weight: 600; font-size: 15px; display: flex; gap: 8px; align-items: center; min-height: 48px; overflow-wrap: anywhere; min-width: 0; line-height: 1.3; }
.mi .num { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-mono); font-size: 12px; background: var(--surface-2); }
.mi.picked { border-color: var(--violet); box-shadow: 0 0 0 3px color-mix(in srgb, var(--violet) 25%, transparent); }
.mi.p0 .num { background: var(--lime); color: #1e1b26; } .mi.p1 .num { background: var(--violet); color: #fff; }
.mi.p2 .num { background: var(--yellow); color: #1e1b26; } .mi.p3 .num { background: #4aa3c8; color: #fff; }
.mi.ok { border-color: var(--right); } .mi.no { border-color: var(--wrong); }
.mi:disabled { cursor: default; color: inherit; }

.order-line { min-height: 54px; border: 2px dashed var(--line); border-radius: var(--r-sm); padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: var(--bg); }
.order-line .ph { color: var(--muted); font-size: 14px; }
.pool { display: flex; flex-wrap: wrap; gap: 8px; }
.tok { border: 2px solid var(--line); background: var(--bg); border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 16px; min-height: 42px; }
.tok.in { background: color-mix(in srgb, var(--lime) 30%, var(--bg)); border-color: var(--lime); }
.tok.used { opacity: .3; }
.tok:disabled { cursor: default; color: inherit; }

.fb { border-radius: var(--r-sm); padding: 12px 14px; display: grid; gap: 6px; font-size: 15px; }
.fb.good { background: var(--right-bg); border: 1px solid var(--right); }
.fb.bad { background: var(--wrong-bg); border: 1px solid var(--wrong); }
.fb .verdict { font-weight: 800; font-family: var(--f-display); font-size: 15px; }
.fb.good .verdict { color: var(--right); } .fb.bad .verdict { color: var(--wrong); }
.task-nav { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.task-nav .grow { flex: 1 1 auto; justify-content: center; }
.foot-acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: space-between; align-items: center; }
.confirm { background: var(--wrong-bg); border: 1px solid var(--wrong); border-radius: var(--r-sm); padding: 12px; display: grid; gap: 8px; }
.gate { background: var(--surface); border: 2px dashed var(--yellow); border-radius: var(--r); padding: 18px; display: grid; gap: 10px; }
.done-card { background: color-mix(in srgb, var(--lime) 16%, var(--surface)); border: 1px solid var(--lime); border-radius: var(--r); padding: 16px; display: grid; gap: 8px; }

/* ── Завдання ЗНО ── */
.hometabs { margin-bottom: 18px; }
.zsum { display: grid; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin-bottom: 22px; }
.zq { font-size: 17px; line-height: 1.55; overflow-wrap: anywhere; }
.zq u, .otext u, .zex-body u { text-decoration-thickness: 2px; text-underline-offset: 3px; text-decoration-color: var(--violet); }
.zimg { display: block; max-width: 100%; height: auto; max-height: 340px; object-fit: contain; border-radius: 8px; background: #fff; margin: 6px 0; }
.zopt { align-items: flex-start; }
.zshape { display: inline-block; min-width: 1.5em; font-size: 1.2em; font-weight: 700; color: var(--violet-ink); line-height: 1; }
.zopt .otext { min-width: 0; flex: 1 1 auto; overflow-wrap: anywhere; }
.zopt.has-img .otext { width: 100%; }
.zopt.has-img .zimg { max-height: 220px; margin: 0; }
.zright { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; }
.zright ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.zright li { display: flex; gap: 10px; align-items: flex-start; font-size: 16px; overflow-wrap: anywhere; min-width: 0; }
.zright .key, .zmatch .key { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); border: 1px solid var(--line); font: 600 13px var(--f-mono); }
.zcol-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 6px; }
.zmatch .w { display: flex; gap: 10px; align-items: flex-start; }
.zmatch .znum { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.zex { border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--bg); }
.zex summary { cursor: pointer; padding: 10px 14px; font-weight: 700; }
.zex-body { padding: 0 14px 12px; font-size: 15px; line-height: 1.6; overflow-wrap: anywhere; }
.ztheory-part { display: grid; gap: 10px; }
.ztheory-h { font-size: 18px; margin-top: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.syn-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0; }
.syn-row span { padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); font-size: 14px; }
.syn-row .syn-core { background: var(--violet-ink); color: #fff; border-color: var(--violet-ink); font-weight: 700; }
.morph { display: flex; justify-content: center; align-items: flex-end; flex-wrap: wrap; font-family: var(--f-display); font-size: 28px; padding: 22px 8px 10px; margin: 6px 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.morph span { padding: 0 3px; position: relative; }
.morph .m-pre { border-top: 3px solid var(--violet); border-right: 3px solid var(--violet); }
.morph .m-root { border: 3px solid transparent; border-top-color: var(--lime-ink); border-bottom: 0; border-radius: 50% 50% 0 0 / 16px 16px 0 0; padding-top: 4px; }
.morph .m-suf::before { content: ""; position: absolute; left: 50%; top: -14px; width: 14px; height: 14px; border-left: 3px solid var(--yellow); border-top: 3px solid var(--yellow); transform: translateX(-50%) rotate(45deg); }
.morph .m-end { border: 3px solid var(--text); }
.pos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin: 6px 0; }
.pos-col { background: var(--bg); border: 1px solid var(--line); border-top: 4px solid var(--violet); border-radius: var(--r-sm); padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; min-width: 0; }
.pos-col h4 { width: 100%; margin: 0 0 4px; font-family: var(--f-display); font-size: 16px; }
.pos-col > span { padding: 4px 10px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; }
.pos-col.pos-serv { border-top-color: var(--lime); }
.pos-col.pos-int { border-top-color: var(--yellow); }
.phrase-scheme { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.phrase-scheme span { padding: 6px 12px; border-radius: var(--r-sm); font-weight: 700; }
.ph-main { background: var(--violet-ink); color: #fff; }
.ph-arrow { color: var(--muted); font-weight: 400 !important; padding: 0 !important; }
.ph-dep { background: var(--lime); color: #111; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: 14px; z-index: 50; max-width: calc(100% - 32px); text-align: center; }

@media (max-width: 560px) {
  .match { grid-template-columns: 1fr; }
  .opts.two { grid-template-columns: 1fr 1fr; }
  .task { padding: 14px 12px; }
  .opt { font-size: 16px; padding: 11px 12px; }
  .mark { width: 220px; }
  .mark--r { right: -120px; top: -70px; opacity: .08; }
  .mark--l { display: none; }
}


/* ── Теорія: читабельність і блоки для запам’ятовування ── */
.tbody { font-size: 17px; line-height: 1.6; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.tbody > * { min-width: 0; }
.mnemo, .rule, .exc, .trap, .quiz, .pairs div, .wl li, .wl dl > div { overflow-wrap: anywhere; min-width: 0; }
.tbody .note, .tbody .cap, .tbody .box span, .tbody .box em, .tbody .algo li span, .tbody .fork-b span, .tbody .triad em, .tbody .assim-legend, .tbody .mg-chip { font-size: 16px; }
.tbody .tbl { font-size: 16px; }
.tbody .tbl th { font-size: 15px; text-transform: none; letter-spacing: 0; }
.tbody .algo li b { font-size: 17px; }
.tbody .box b { font-size: 17px; }
.tbody .syl-tag { font-size: 14px; }
.tbody h3 { font-size: 19px; margin-top: 10px; padding-top: 14px; border-top: 2px solid var(--line); }
.tbody h3:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
.tbody h4 { font-size: 17px; margin: 0; font-family: var(--f-display); }
.rule { background: color-mix(in srgb, var(--lime) 16%, var(--surface)); border: 2px solid var(--lime); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 6px; font-size: 18px; }
.rule > b:first-child { font-family: var(--f-display); font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: var(--lime-ink); }
.mnemo { position: relative; background: color-mix(in srgb, var(--violet) 12%, var(--surface)); border: 2px dashed var(--violet); border-radius: var(--r); padding: 14px 16px 14px 58px; display: grid; gap: 6px; }
.mnemo::before { content: "💡"; position: absolute; left: 16px; top: 12px; font-size: 26px; }
.mnemo > b:first-child { font-family: var(--f-display); font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: var(--violet-ink); }
.mnemo .say { font-family: var(--f-display); font-size: 20px; font-weight: 700; line-height: 1.3; }
.mnemo .say u { text-decoration-color: var(--lime); text-decoration-thickness: 3px; text-underline-offset: 4px; }
.exc { background: color-mix(in srgb, var(--yellow) 16%, var(--surface)); border-left: 6px solid var(--yellow); border-radius: var(--r-sm); padding: 12px 14px; display: grid; gap: 6px; }
.exc > b:first-child { font-family: var(--f-display); font-size: 14px; letter-spacing: .06em; text-transform: uppercase; }
.trap { background: var(--wrong-bg); border-left: 6px solid var(--wrong); border-radius: var(--r-sm); padding: 12px 14px; display: grid; gap: 8px; }
.trap > b:first-child { font-family: var(--f-display); font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: var(--wrong); }
.pairs { display: grid; gap: 6px; }
.pairs div { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.pairs s { color: var(--wrong); text-decoration-thickness: 2px; }
.pairs ins { color: var(--right); text-decoration: none; font-weight: 700; }
.pairs ins::before { content: "→ "; color: var(--muted); font-weight: 400; }
.quiz { display: grid; gap: 8px; }
.quiz > b:first-child { font-family: var(--f-display); font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: var(--violet-ink); }
.quiz details { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); }
.quiz summary { cursor: pointer; padding: 12px 14px; font-weight: 700; list-style: none; display: flex; gap: 10px; align-items: baseline; }
.quiz summary::before { content: "?"; flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--violet); color: #fff; display: grid; place-items: center; font: 800 15px var(--f-display); }
.quiz details[open] summary::before { content: "✓"; background: var(--lime); color: #1e1b26; }
.quiz details > div { padding: 0 14px 12px 50px; }
.cols2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.wl-box { display: grid; gap: 10px; }
.wl-filter { width: 100%; border: 2px solid var(--line); border-radius: 999px; padding: 10px 16px; font-size: 17px; background: var(--surface); color: var(--text); }
.wl-filter:focus { outline: none; border-color: var(--lime); }
.wl { display: grid; gap: 10px; }
.wl section { display: grid; gap: 6px; }
.wl h4 { font-size: 18px; color: var(--violet-ink); }
.wl ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.wl li { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 5px 10px; font-size: 17px; }
.wl li small { font-size: 14px; color: var(--muted); }
.wl dl { margin: 0; display: grid; gap: 6px; }
.wl dl > div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.wl dt { font-weight: 800; }
.wl dd { margin: 2px 0 0; }
.wl [hidden] { display: none !important; }
.wl-empty { color: var(--muted); }
/* ── Три розділи на головній ── */
.hometabs.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.hometabs.four { grid-template-columns: repeat(4, minmax(0, 1fr)); border-radius: 22px; }
.hometabs.four .tab { padding-inline: 6px; line-height: 1.2; font-size: 15px; }
@media (max-width: 640px) { .hometabs.four { grid-template-columns: 1fr 1fr; } .hometabs.four .tab { font-size: 14px; } }
.tab-badge { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--wrong); color: #fff; font-size: 12px; font-weight: 800; vertical-align: 1px; margin-left: 2px; }
.fx-sum { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; margin-bottom: 14px; }
.fx-sum .bar b { background: var(--wrong-bg); }
.fx-card .bar b { background: var(--wrong-bg); }
.fx-how { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; margin-bottom: 18px; }
.fx-how summary { font-weight: 800; cursor: pointer; }
.fx-how[open] summary { margin-bottom: 10px; }
.fx-how .hint { margin-top: 10px !important; }
.fx-empty { border: 2px dashed var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 6px; }
.fx-head { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.fx-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.fx-steps li { font-size: 13px; font-weight: 700; padding: 6px 10px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); }
.fx-steps li.ok { background: var(--right-bg); border-color: var(--right); color: var(--right); }
.fx-steps li.ok::before { content: "✓ "; }
.fx-steps li.cur { border-color: var(--violet); background: color-mix(in srgb, var(--violet) 14%, var(--surface)); }
.fx-review .task-head .kind { color: var(--wrong); }
.hometabs.three .tab { padding-inline: 6px; line-height: 1.2; font-size: 15px; }
@media (max-width: 420px) { .hometabs.three .tab { font-size: 14px; } }

/* ── Симуляція НМТ: список ── */
.nmt-intro { gap: 10px; }
.nmt-h { font-size: clamp(19px, 4.6vw, 24px); }
.nmt-src { margin: 0; font-size: 15px; color: var(--muted); }
.nmt-src a, .nmt-link, .dict-src a { color: var(--violet-ink); font-weight: 700; }
.nmt-facts { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.nmt-facts li { background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 15px; }
.nmt-facts b { font-family: var(--f-display); }
.nmt-live { color: var(--violet-ink); font-weight: 700; }
.nmt-link { font-size: 14px; justify-self: start; }

/* ── Симуляція НМТ: правила й старт ── */
.nmt-paper { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 14px; font-size: 17px; }
.nmt-paper h2 { font-size: clamp(19px, 4.6vw, 24px); }
.nmt-paper h3 { font-size: 18px; }
.nmt-paper p { margin: 0; }
.nmt-rule { display: grid; gap: 2px; border-left: 5px solid var(--lime); background: var(--bg); border-radius: var(--r-sm); padding: 10px 14px; }
.nmt-rule b { font-family: var(--f-display); font-size: 17px; }
.nmt-warn { display: grid; gap: 4px; background: var(--wrong-bg); border: 1px solid var(--wrong); border-radius: var(--r-sm); padding: 12px 14px; }
.nmt-warn b { color: var(--wrong); font-family: var(--f-display); }
.nmt-paper .algo li span { font-size: 16px; }
.nmt-start { border-left: 6px solid var(--lime); }
.nmt-modal { position: fixed; inset: 0; z-index: 40; background: rgb(18 16 26 / .55); display: grid; place-items: center; padding: 16px; }
.nmt-dlg { background: var(--bg); border-radius: var(--r); padding: 20px; max-width: 560px; width: 100%; display: grid; gap: 14px; max-height: 90vh; overflow: auto; box-shadow: 0 20px 60px rgb(0 0 0 / .3); font-size: 16px; }
.nmt-dlg h3 { font-size: 19px; }
.nmt-dlg p { margin: 0; }
.nmt-dlg-acts { display: flex; flex-wrap: wrap; gap: 8px; }
.nmt-dlg-acts .btn { flex: 1 1 200px; justify-content: center; text-align: center; }
.nmt-alert { display: grid; gap: 4px; background: var(--wrong-bg); border: 1px solid var(--wrong); border-radius: var(--r-sm); padding: 10px 12px; }

/* ── Симуляція НМТ: тест ── */
body.exam .hero, body.exam .fab, body.exam .selchip, body.exam #dict-btn { display: none !important; }
.nx-bar { position: sticky; top: 0; z-index: 6; background: #1e1b26; color: #f4f1f9; box-shadow: 0 4px 16px rgb(0 0 0 / .18); }
.nx-in { max-width: 860px; margin: 0 auto; padding: 10px 16px 6px; display: flex; align-items: center; gap: 10px; }
.nx-title { display: grid; min-width: 0; flex: 1 1 auto; line-height: 1.25; overflow: hidden; }
.nx-title b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 560px) { .nx-title { display: none; } .nx-in { justify-content: space-between; } }
.nx-title b { font-family: var(--f-display); font-size: 15px; }
.nx-title span { font-size: 13px; opacity: .8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nx-time { flex: none; display: inline-flex; align-items: center; gap: 6px; border: 2px solid #4a4360; background: #2a2538; color: #fff; border-radius: 999px; padding: 6px 12px; font-size: 18px; font-weight: 700; min-height: 42px; }

.nx-eye { font-size: 16px; opacity: .8; }
.nx-fin { flex: none; background: var(--lime); border-color: var(--lime); color: #1e1b26; white-space: normal; line-height: 1.15; text-align: center; max-width: 170px; }
.nx-grid { max-width: 860px; margin: 0 auto; padding: 4px 16px 8px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin; }
.nx-c { flex: none; width: 38px; height: 38px; border-radius: 8px; border: 2px solid #4a4360; background: transparent; color: #f4f1f9; font: 700 15px var(--f-mono); display: grid; place-items: center; padding: 0; text-decoration: none; }
.nx-c.sv { background: var(--violet); border-color: var(--violet); color: #fff; }
.nx-c.dr { border-color: var(--yellow); border-style: dashed; }
.nx-count { max-width: 860px; margin: 0 auto; padding: 0 16px 8px; font-size: 14px; opacity: .85; }
@media (min-width: 760px) { .nx-grid { flex-wrap: wrap; overflow: visible; } }
.nx-main { display: grid; gap: 16px; padding-top: 16px; }
.nx-instr { background: color-mix(in srgb, var(--yellow) 18%, var(--surface)); border-left: 5px solid var(--yellow); border-radius: var(--r-sm); padding: 12px 14px; font-size: 16px; }
.nx-end { display: grid; padding-block: 10px 30px; }
.nq { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 14px; min-width: 0; scroll-margin-top: 150px; }
.nq.is-saved { border-color: var(--violet); box-shadow: inset 4px 0 0 var(--violet); }
.nq-h { font-size: 18px; }
.nq-hrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.nq-q { font-size: 17px; line-height: 1.6; overflow-wrap: anywhere; min-width: 0; display: grid; gap: 8px; }
.nq-q p, .nq-t p, .zex-body p { margin: 0; }
.nq-q table, .zex-body table { border-collapse: collapse; width: 100%; font-size: 16px; }
.nq-q td, .nq-q th, .zex-body td, .zex-body th { border: 1px solid var(--line); padding: 8px 10px; vertical-align: top; }

.nq-q img, .nq-t img, .zex-body img, .nm-t img { max-width: 100%; height: auto; border-radius: 6px; background: #fff; }
.nq-opts { display: grid; gap: 8px; }
.nq-opt { text-align: left; width: 100%; border: 2px solid var(--line); background: var(--bg); border-radius: var(--r-sm); padding: 12px 14px; font-size: 17px; line-height: 1.45; display: flex; gap: 10px; align-items: flex-start; min-height: 52px; overflow-wrap: anywhere; min-width: 0; color: inherit; }
button.nq-opt:hover { border-color: var(--violet); }
.nq-radio { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--muted); margin-top: 1px; display: grid; place-items: center; }
.nq-opt.on { border-color: var(--violet); background: color-mix(in srgb, var(--violet) 10%, var(--bg)); }
.nq-opt.on .nq-radio { border-color: var(--violet); }
.nq-opt.on .nq-radio::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--violet); }
.nq-k { flex: none; font: 700 15px var(--f-mono); color: var(--muted); min-width: 1.2em; margin-top: 2px; }
.nq-t { min-width: 0; flex: 1 1 auto; }
.nq-opt.ok { border-color: var(--right); background: var(--right-bg); }
.nq-opt.no { border-color: var(--wrong); background: var(--wrong-bg); }
.nq-opt .tag { flex: none; margin-left: auto; font-size: 14px; font-weight: 700; }
.nq-opt.ok .tag { color: var(--right); } .nq-opt.no .tag { color: var(--wrong); }
.nq-save { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.nq-st { font-size: 15px; font-weight: 700; color: var(--violet-ink); }
.nq-st.warn { color: var(--wrong); }

/* Відповідність («логічні пари») */
.nm { display: grid; gap: 14px; }
@media (min-width: 720px) { .nm { grid-template-columns: 1.15fr 1fr; align-items: start; } }
.nm-col { display: grid; gap: 8px; min-width: 0; }
.nm-row { display: grid; gap: 6px; background: color-mix(in srgb, #4aa3c8 12%, var(--bg)); border: 1px solid color-mix(in srgb, #4aa3c8 45%, var(--line)); border-radius: var(--r-sm); padding: 10px; }
.nm-left { display: flex; gap: 10px; align-items: flex-start; font-size: 16px; min-width: 0; overflow-wrap: anywhere; }
.nm-key { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: #4aa3c8; color: #fff; font: 700 14px var(--f-mono); }
.nm-key.b { background: var(--lime); color: #1e1b26; }
.nm-t { min-width: 0; flex: 1 1 auto; }
.nm-t.sm { font-size: 15px; }
.nm-slot { min-height: 50px; border: 2px dashed var(--muted); border-radius: var(--r-sm); background: var(--bg); padding: 8px 10px; display: flex; gap: 8px; align-items: flex-start; text-align: left; width: 100%; color: inherit; font-size: 15px; overflow-wrap: anywhere; min-width: 0; }
.nm-slot.filled { border-style: solid; border-color: var(--violet); }
.nm-slot.picked, .nm-card.picked { outline: 3px solid var(--violet); outline-offset: 2px; }
.nm-slot.ok { border-color: var(--right); background: var(--right-bg); }
.nm-slot.no { border-color: var(--wrong); background: var(--wrong-bg); }
.nm-slot.miss { border-color: var(--wrong); }
.nm-ph { color: var(--muted); font-size: 14px; align-self: center; }
.nm-x { margin-left: auto; color: var(--muted); font-size: 20px; line-height: 1; }
.nm-right-ans { align-self: center; font-size: 15px; }
.nm-card { display: flex; gap: 10px; align-items: flex-start; text-align: left; width: 100%; border: 2px solid color-mix(in srgb, var(--lime) 60%, var(--line)); background: color-mix(in srgb, var(--lime) 16%, var(--bg)); border-radius: var(--r-sm); padding: 10px; font-size: 16px; color: inherit; overflow-wrap: anywhere; min-width: 0; cursor: grab; }
.nm-card.used { opacity: .45; }
div.nm-card { cursor: default; }

/* ── Симуляція НМТ: результат ── */
.nmt-res { display: grid; gap: 16px; }
.nmt-score { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); border-radius: var(--r); padding: 18px; border: 2px solid var(--lime); background: color-mix(in srgb, var(--lime) 14%, var(--surface)); }
.nmt-score.fail { border-color: var(--wrong); background: var(--wrong-bg); }
.nmt-big { display: grid; gap: 2px; }
.nmt-big .lbl { font-size: 15px; font-weight: 700; color: var(--muted); }
.nmt-big b { font-family: var(--f-display); font-size: 48px; line-height: 1.05; }
.nmt-big small { font-size: 22px; color: var(--muted); }
.nmt-fail { font-weight: 700; color: var(--wrong); font-size: 15px; }
.nmt-break { grid-column: 1 / -1; list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 6px 14px; font-size: 16px; }
.nmt-scalebar { grid-column: 1 / -1; height: 12px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; }
.nmt-scalebar i { display: block; height: 100%; background: var(--lime); }
.nmt-score.fail .nmt-scalebar i { background: var(--wrong); }
.nx-grid.res { flex-wrap: wrap; padding: 0; }
.nx-grid.res .nx-c { color: var(--text); border-color: var(--line); }
.nx-c.ok { background: var(--right-bg); border-color: var(--right) !important; color: var(--right) !important; }
.nx-c.part { background: color-mix(in srgb, var(--yellow) 25%, transparent); border-color: var(--yellow) !important; }
.nx-c.no { background: var(--wrong-bg); border-color: var(--wrong) !important; color: var(--wrong) !important; }
.legend .lp::before { background: color-mix(in srgb, var(--yellow) 25%, transparent); border-color: var(--yellow); }
.nq.rv-ok { border-left: 6px solid var(--right); }
.nq.rv-part { border-left: 6px solid var(--yellow); }
.nq.rv-no { border-left: 6px solid var(--wrong); }
.rv-pts { font-weight: 700; font-size: 16px; }
.rv-none { margin: 0; color: var(--wrong); font-weight: 700; }
.rv-th { display: flex; flex-wrap: wrap; gap: 8px; }

/* ── Бічна панель: теорія й словник ── */
html.sheet-open, html.sheet-open body { overflow: hidden; }
.sheet-bg { position: fixed; inset: 0; z-index: 50; background: rgb(18 16 26 / .5); display: flex; align-items: flex-end; justify-content: center; }
.sheet-bg[hidden] { display: none; }
.sheet { background: var(--bg); width: 100%; max-width: 820px; height: min(92vh, 92dvh); border-radius: 20px 20px 0 0; display: flex; flex-direction: column; box-shadow: 0 -10px 40px rgb(0 0 0 / .25); overflow: hidden; }
@media (min-width: 900px) { .sheet-bg { justify-content: flex-end; align-items: stretch; } .sheet { height: 100%; max-width: 560px; border-radius: 0; } }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
.sheet-head b { flex: 1 1 auto; min-width: 0; font-family: var(--f-display); font-size: 16px; line-height: 1.25; overflow-wrap: anywhere; }
.sheet-head .btn { flex: none; text-decoration: none; }
.sheet-search { display: flex; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.sheet-search[hidden] { display: none; }
.sheet-search input { flex: 1 1 auto; min-width: 0; border: 2px solid var(--line); border-radius: 999px; padding: 8px 14px; font-size: 17px; background: var(--surface); }
.sheet-search input:focus { outline: none; border-color: var(--lime); }
.sheet-body { flex: 1 1 auto; overflow: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; }
.sheet-body > .theory, .sheet-body > .empty, .sheet-body > .dict-hint { padding: 16px; }
.theory.in-sheet { padding-block: 16px 40px; }
.dict-wrap { position: relative; flex: 1 1 auto; display: flex; min-height: 60vh; }
.dict-wait { position: absolute; inset: 40px 0 auto; text-align: center; color: var(--muted); font-size: 16px; }
.dict-frame { position: relative; flex: 1 1 auto; width: 100%; border: 0; background: #fff; opacity: 0; transition: opacity .2s; }
.dict-frame.ready { opacity: 1; }
.dict-src { margin: 0; padding: 8px 14px; font-size: 14px; color: var(--muted); border-top: 1px solid var(--line); }
.dict-hint { display: grid; gap: 10px; font-size: 17px; }
.dict-hint p { margin: 0; }
.dict-btn { cursor: pointer; height: 30px; white-space: nowrap; flex: none; }
@media (max-width: 480px) { .dict-btn .lbl { display: none; } }
.fab { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 30; border: 0; border-radius: 999px; background: var(--violet-ink); color: #fff; font-weight: 800; font-size: 16px; padding: 12px 18px; min-height: 48px; box-shadow: 0 8px 24px rgb(0 0 0 / .25); }
.fab[hidden], .selchip[hidden] { display: none; }
body.has-fab main { padding-bottom: 110px; }
.selchip { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 31; border: 0; border-radius: 999px; background: var(--lime); color: #1e1b26; font-size: 16px; font-weight: 600; padding: 12px 18px; min-height: 48px; max-width: calc(100vw - 32px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 8px 24px rgb(0 0 0 / .25); }
@media (prefers-reduced-motion: no-preference) { .bar i, .bar b { transition: width .3s ease; } }
</style>

</head>
<body>
<header class="hero">
  <img class="mark mark--r" src="img/mark-green-wave.png" alt="">
  <img class="mark mark--l" src="img/mark-purple-spiral.png" alt="">
  <div class="wrap">
    <div class="brand">
      <img class="logo" src="img/logo-wordmark.png" alt="Midgard">
      <div class="brand-tools">
        <button class="chip dict-btn" id="dict-btn" type="button" aria-label="Відкрити тлумачний словник">📖<span class="lbl"> Словник</span></button>
        <span class="chip" id="sync-chip"><span class="dot"></span><span id="sync-text">Прогрес у профілі</span></span>
      </div>
    </div>
    <h1>Українська мова: <em>тренажер, ЗНО і НМТ</em></h1>
    <p class="sub">Тренажер: 33 теми з теорією і 100 завданнями в кожній. Банк завдань ЗНО з поясненнями. Симуляція НМТ з таймером і балами 100–200. Виділіть будь-яке слово, щоб побачити його значення.</p>
    <div class="namebox" id="profilebox"></div>

<div id="app"></div>

<div class="sheet-bg" id="sheet" hidden>

      <b id="sheet-h"></b>

    </header>
    <form class="sheet-search" id="sheet-search" hidden>
      <input type="search" id="sheet-q" placeholder="Слово або вислів" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Слово для пошуку в словнику">

<script src="data-extra.js?v=13"></script>
<script src="engine.js?v=13"></script>

<script src="fix-app.js?v=13"></script>
<script>
(function () {
  const T = window.TOPICS, S = window.SECTIONS, E = window.MGEngine, N = E.TOTAL;
  const $ = s => document.querySelector(s);
  const app = $("#app");
  const LS = "mg-ukr-trainer-v1";
  const EMPTY = ".".repeat(N);
  const TYPE = { one: "Оберіть одну відповідь", multi: "Кілька правильних відповідей", sort: "Розподіл за групами", match: "Встановіть відповідність", order: "Розташуйте в правильному порядку" };
  const IMG = { phonetics: "img/phonetics.jpg", ortho: "img/ortho.jpg", lexic: "img/lexic.jpg", foreign: "img/foreign.jpg", phraseo: "img/phraseo.jpg", compound: "img/compound.jpg", antonym: "img/antonym.jpg", error: "img/error.jpg", assim: "img/assim.jpg", alter: "img/alter.jpg", nn: "img/nn.jpg", dash: "img/dash.jpg", ne: "img/ne.jpg" };
  const ALT = { phonetics: "Мікрофон на тлі звукових хвиль", ortho: "Зошит, ручка й маркер на столі", lexic: "Відкритий словник і лупа", foreign: "Книжки, глобус і паспорт", phraseo: "Керамічний кіт біля мішка на вишитому рушнику", compound: "Кубики, з яких складено місток", antonym: "Чорні й білі шахові фігури одна навпроти одної", error: "Червоний і зелений олівці на аркуші з текстом", assim: "Дві скляні кульки, що торкаються, кольори яких змішуються", alter: "Зелені, фіолетова й жовта шестерні", nn: "Дві зелені нитки й одна фіолетова на п’яльцях", dash: "Зелена планка, перекинута між фіолетовим і білим камінцями", ne: "Зелені й фіолетовий кубики: два впритул, два з проміжком" };
  const TASKS = {};
  const tasksOf = id => TASKS[id] || (TASKS[id] = E.buildTasks(T.find(t => t.id === id)));
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  /* ───── Локальне сховище ───── */
  function loadStore() {
    try { const s = JSON.parse(localStorage.getItem(LS)); if (s && s.students) return s; } catch (e) {}
    return { current: "", students: {} };
  }
  let store = loadStore();
  function saveLocal() { try { localStorage.setItem(LS, JSON.stringify(store)); } catch (e) {} }
  const slugOf = n => n.trim().toLowerCase().replace(/\s+/g, " ").replace(/[^\p{L}\p{N} ’'-]/gu, "").replace(/[ ’'-]+/g, "_").slice(0, 80);
  const me = () => store.students[store.current] || null;
  function tstate(id) {
    const s = me(); if (!s) return null;
    if (!s.topics[id]) s.topics[id] = { r: EMPTY, ch: {} };
    if (!s.topics[id].ch) s.topics[id].ch = {};
    return s.topics[id];
  }
  function statsOf(r) { let a = 0, c = 0; for (const ch of r || "") { if (ch !== ".") a++; if (ch === "1") c++; } return { a, c }; }
  const topicStats = id => { const s = me(); return statsOf(s && s.topics[id] ? s.topics[id].r : EMPTY); };

  /* ───── Теорія тем тренажера: theory/<id>.html, завантажуємо під час першого відкриття ───── */
  const VER = "13", THEORY = {}, theoryLoading = {};
  function loadTheoryFile(id) {
    if (THEORY[id] != null) return Promise.resolve(THEORY[id]);
    if (!theoryLoading[id]) theoryLoading[id] = fetch("theory/" + id + ".html?v=" + VER).then(r => r.ok ? r.text() : Promise.reject(r.status))
      .catch(() => { const t = T.find(x => x.id === id); return t && t.theory ? t.theory : '<p class="empty">Не вдалося завантажити теорію. Перевірте інтернет.</p>'; })
      .then(x => { THEORY[id] = x; return x; });
    return theoryLoading[id];
  }
  function theoryOf(id) {
    if (THEORY[id] != null) return THEORY[id];
    loadTheoryFile(id).then(() => render());
    return null;
  }

  /* ───── UI-стан ───── */
  let ui = { view: "home", topic: null, tab: "theory", cur: 0, map: false };
  let pend = null, confirmReset = false;
  if (!store.home) store.home = "trainer";
  const Z = window.MGZno({
    esc, $, get ui() { return ui; },
    me: () => me(), loggedIn: () => loggedIn(), currentKey: () => store.current,
    saveLocal: () => saveLocal(), scheduleSync: now => scheduleSync(now), toast: m => toast(m),
    render: () => render(), scrollTask: () => scrollTask(), gateHtml: () => gateHtml(),
    trainerTopic: id => { const t = T.find(x => x.id === id); if (!t) return null; const th = theoryOf(id); return { title: t.title, theory: th == null ? '<p class="empty">Завантажую теорію…</p>' : th }; },
    loadTrainerTheory: id => loadTheoryFile(id),
    setZnoUnique: n => { store.znoUnique = n; }, getZnoUnique: () => store.znoUnique || 0,
    fixCount: g => FX.openCount(g)
  });
  const NM = window.MGNmt({
    esc, get ui() { return ui; },
    me: () => me(), loggedIn: () => loggedIn(), currentKey: () => store.current, fullName: () => (me() ? fullName(me()) : ""),
    saveLocal: () => saveLocal(), scheduleSync: now => scheduleSync(now), toast: m => toast(m),
    render: () => render(), gateHtml: () => gateHtml(), theoryRef: ref => theoryRef(ref), fixCount: g => FX.openCount(g)
  });
  /* Розділ «Мої помилки» (fix-app.js). Тренажерні завдання показуємо тими самими функціями, що й у темах. */
  const FX = window.MGFix({
    esc, T, E, Z, NM, tasksOf, get ui() { return ui; },
    me: () => me(), loggedIn: () => loggedIn(), saveLocal: () => saveLocal(), scheduleSync: now => scheduleSync(now),
    render: () => render(), toast: m => toast(m), gateHtml: () => gateHtml(), theoryRef: ref => theoryRef(ref), scrollTask: () => scrollTask(),
    setHome: h => { store.home = h; saveLocal(); },
    typeName: t => TYPE[t], correctHtml: task => correctHtml(task), plain: h => plain(h),
    answerText: (task, resp) => answerText(task, resp), rightText: task => rightText(task),
    trainerNewPend: (task, topic) => newPend(task, topic),
    trainerBody: (task, done, resp, p) => { const keep = pend; pend = p; const h = bodyHtml(task, done, resp); pend = keep; return h; },
    trainerReady: (task, p) => { const keep = pend; pend = p; const ok = ready(task); pend = keep; return ok; },
    trainerInput: (b, p) => inputClick(b.dataset, p),
    trainerResp: (task, p) => task.t === "one" ? p.v : task.t === "multi" ? p.v.slice().sort((a, b) => a - b) : p.v.slice()
  });

  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => { t.hidden = true; }, 2600); }

  /* ───── Профіль учня ───── */
  const RESULTS_URL = (window.MG_CONFIG && window.MG_CONFIG.resultsUrl || "").trim();
  const loggedIn = () => { const s = me(); return !!(s && (s.token || (!RESULTS_URL && s.cls))); };
  const fullName = s => s.name + (s.cls ? " (" + s.cls + ")" : "");
  const cleanPart = v => String(v || "").trim().replace(/\s+/g, " ").slice(0, 40);
  const ERR = {
    exists: "Такий профіль уже існує. Натисніть «Увійти».",
    not_found: "Профіль не знайдено. Перевірте ім’я, прізвище й клас або створіть профіль.",
    bad_pin: "Неправильний PIN-код.",
    locked: "Забагато невдалих спроб. Зачекайте 15 хвилин або зверніться до вчителя.",
    bad_name: "Впишіть ім’я, прізвище й клас.",
    bad_pin_format: "PIN-код — від 4 до 6 цифр."
  };
  let pmode = "login", pbusy = false, pmsg = "", pmsgBad = false;
  function readForm() {
    const g = id => { const el = $("#" + id); return el ? el.value : ""; };
    return { first: g("p-first"), last: g("p-last"), cls: g("p-cls"), pin: g("p-pin"), pin2: g("p-pin2") };
  }
  function fillForm(v) {
    if (!v) return;
    ["first", "last", "cls", "pin", "pin2"].forEach(k => { const el = $("#p-" + k); if (el && v[k]) el.value = v[k]; });
  }
  function renderProfile() {
    const box = $("#profilebox"), s = me();
    if (loggedIn()) {
      box.classList.remove("need");
      box.innerHTML = `<label>Профіль учня</label><div class="namerow"><span class="pname"></span><button class="btn small" id="p-logout" type="button">Вийти</button></div>
        <span class="hint">${RESULTS_URL ? "Прогрес зберігається в профілі. На іншому пристрої увійдіть з тими самими ім’ям, класом і PIN-кодом." : "Прогрес зберігається на цьому пристрої."}</span>`;
      box.querySelector(".pname").textContent = fullName(s);
      return;
    }
    const reg = pmode === "register";
    box.classList.add("need");
    box.innerHTML = `<div class="ptabs" role="tablist"><button class="tab" type="button" role="tab" aria-selected="${!reg}" data-pmode="login">Увійти</button><button class="tab" type="button" role="tab" aria-selected="${reg}" data-pmode="register">Створити профіль</button></div>
      <form id="pform" class="pform" novalidate>
        <div class="pgrid">
          <label>Ім’я<input id="p-first" autocomplete="given-name" maxlength="40"></label>
          <label>Прізвище<input id="p-last" autocomplete="family-name" maxlength="40"></label>
          <label>Клас<input id="p-cls" maxlength="12" placeholder="напр. 7-А" autocomplete="off"></label>
          ${RESULTS_URL ? `<label>PIN-код<input id="p-pin" type="password" inputmode="numeric" maxlength="6" placeholder="4–6 цифр" autocomplete="${reg ? "new-password" : "current-password"}"></label>` : ""}
          ${RESULTS_URL && reg ? `<label>Повторіть PIN<input id="p-pin2" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></label>` : ""}
        </div>
        <div class="namerow"><button class="btn primary" id="p-submit" type="submit" ${pbusy ? "disabled" : ""}>${pbusy ? "Зачекайте…" : reg ? "Створити профіль" : "Увійти"}</button></div>
        <span class="hint ${pmsgBad ? "bad" : ""}" id="p-msg"></span>
      </form>`;
    $("#p-msg").textContent = pmsg || (reg
      ? (RESULTS_URL ? "Придумайте PIN-код і запам’ятайте його: з ним ви ввійдете на будь-якому пристрої." : "Профіль зберігається на цьому пристрої.")
      : "Ще немає профілю? Натисніть «Створити профіль».");
  }
  function profileFail(msg, v) { pbusy = false; pmsg = msg; pmsgBad = true; renderProfile(); fillForm(v); return false; }
  async function api(body) {
    for (let i = 0; i < 3; i++) {
      try {
        const res = await fetch(RESULTS_URL, { method: "POST", credentials: "omit", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) });
        const d = JSON.parse(await res.text());
        if (d && (d.ok || d.error !== "server")) return d;
      } catch (e) {}
      await new Promise(r => setTimeout(r, 1200 * (i + 1)));
    }
    return null;
  }
  function mergeTopics(rec, topics) {
    for (const id in topics || {}) {
      if (resetIds.has(id)) continue;
      const lt = rec.topics[id] || (rec.topics[id] = { r: EMPTY, ch: {} });
      lt.r = mergeR(lt.r, topics[id].r);
      lt.att = Math.max(lt.att || 1, Number(topics[id].att) || 1);
    }
  }
  /* Прогрес, збережений на цьому пристрої до появи профілів (лише за ім’ям), переносимо в профіль. */
  function adoptLegacy(rec, name) {
    for (const k in store.students) {
      const o = store.students[k];
      if (o === rec || o.token || o.cls || String(o.name || "").toLowerCase() !== name.toLowerCase()) continue;
      for (const id in o.topics || {}) {
        const lt = rec.topics[id] || (rec.topics[id] = { r: EMPTY, ch: {} });
        lt.r = mergeR(lt.r, o.topics[id].r);
        lt.att = Math.max(lt.att || 1, o.topics[id].att || 1);
        lt.ch = Object.assign({}, o.topics[id].ch || {}, lt.ch || {});
      }
      rec.queue = (rec.queue || []).concat(o.queue || []);
      delete store.students[k];
    }
  }
  async function submitProfile() {
    if (pbusy) return;
    const v = readForm();
    const first = cleanPart(v.first), last = cleanPart(v.last), cls = cleanPart(v.cls).toUpperCase().slice(0, 12);
    if (!first || !last) return profileFail("Впишіть ім’я та прізвище.", v);
    if (!cls) return profileFail("Вкажіть клас, наприклад 7-А.", v);
    const name = first + " " + last;
    if (!RESULTS_URL) {
      const key = slugOf(name + " " + cls);
      const rec = store.students[key] || (store.students[key] = { name, cls, topics: {} });
      adoptLegacy(rec, name);
      return finishLogin(key);
    }
    if (!/^\d{4,6}$/.test(v.pin)) return profileFail(ERR.bad_pin_format, v);
    if (pmode === "register" && v.pin !== v.pin2) return profileFail("PIN-коди не збігаються.", v);
    pbusy = true; pmsg = ""; pmsgBad = false; renderProfile(); fillForm(v);
    const d = await api({ action: pmode, first, last, cls, pin: v.pin });
    if (!d) return profileFail("Немає зв’язку з сервером. Перевірте інтернет і спробуйте ще раз.", v);
    if (!d.ok) return profileFail(ERR[d.error] || "Не вдалося. Спробуйте ще раз.", Object.assign(v, { pin: "", pin2: "" }));
    pbusy = false;
    const rec = store.students[d.key] || (store.students[d.key] = { topics: {} });
    Object.assign(rec, { name: d.name, cls: d.cls, token: d.token });
    serverV = Number(d.v) || serverV;
    mergeTopics(rec, d.topics);
    Z.merge(rec, d.zno);
    NM.merge(rec, d.nmt);
    FX.merge(rec, d.fix);
    adoptLegacy(rec, d.name);
    pulledFor = d.key;
    finishLogin(d.key);
  }
  function finishLogin(key) {
    store.current = key; pmsg = ""; pmsgBad = false; pmode = "login";
    saveLocal(); pend = null; renderProfile(); render(); scheduleSync(true);
    toast("Вітаємо, " + me().name.split(" ")[0] + "!");
  }
  async function logout() {
    const s = me();
    if (s && s.token && RESULTS_URL) { clearTimeout(syncTimer); await pushNow(); }
    if (s) {
      delete s.token;
      // На спільному пристрої не лишаємо чужий прогрес, якщо все вже надіслано.
      if (RESULTS_URL && !(s.queue && s.queue.length)) delete store.students[store.current];
    }
    FX.quit(); store.current = ""; pulledFor = null; saveLocal();
    ui.view = "home"; pend = null; renderProfile(); render(); window.scrollTo(0, 0);
    toast("Ви вийшли з профілю");
  }
  const pbox = $("#profilebox");
  pbox.addEventListener("submit", e => { e.preventDefault(); submitProfile(); });
  pbox.addEventListener("click", e => {

    if (b.dataset.pmode) { const v = readForm(); pmode = b.dataset.pmode; pmsg = ""; pmsgBad = false; renderProfile(); fillForm(v); }

  $("#who-change").addEventListener("click", () => { ui.view = "home"; render(); window.scrollTo(0, 0); });

  /* ───── Збереження прогресу в таблиці вчителя ───── */
  let syncTimer = null, syncing = false, syncAgain = false, pulledFor = null, serverV = 0;
  /* Записи журналу з тем ЗНО приймає лише скрипт версії 5+, до того вони чекають у черзі. */
  const isZnoEvent = e => /^z[0-9a-f]{6}$/.test(String(e.topic || ""));
  /* Події ЗНО приймає скрипт таблиці від версії 5, події НМТ — від версії 6. */
  const canSend = e => /^nmt:/.test(String(e.topic || "")) ? serverV >= 6 : serverV >= 5 || !isZnoEvent(e);
  const resetIds = new Set();
  function setSync(mode) {
    const chip = $("#sync-chip"), txt = $("#sync-text");
    chip.classList.remove("ok", "bad");
    const M = {
      local: ["Лише на пристрої", ""],
      ready: ["Прогрес у профілі", "ok"],
      saving: ["Зберігаю…", "ok"],
      saved: ["Збережено", "ok"],
      error: ["Немає зв’язку", "bad"]
    };
    const m = M[mode] || M.local; txt.textContent = m[0]; if (m[1]) chip.classList.add(m[1]);
    chip.title = mode === "local" ? "Учитель ще не підключив таблицю результатів. Звіт можна скопіювати внизу сторінки." : mode === "error" ? "Прогрес збережено на пристрої й буде надіслано, щойно з’явиться інтернет." : "";
  }
  function scheduleSync(now) {
    const s = me();
    if (!RESULTS_URL || !s || !s.token) return;
    clearTimeout(syncTimer);
    // Поки не завантажено збережений прогрес профілю, нічого не надсилаємо, щоб не перезаписати таблицю.
    if (pulledFor !== store.current) { syncTimer = setTimeout(() => scheduleSync(now), 700); return; }
    syncTimer = setTimeout(pushNow, now ? 50 : 1500);
  }
  async function pushNow() {
    const s = me();

    if (syncing) { syncAgain = true; return; }
    syncing = true; setSync("saving");
    const key = store.current, body = { action: "save", key, token: s.token, topics: {} };
    for (const id in s.topics) {
      const r = s.topics[id].r;
      if (r !== EMPTY || resetIds.has(id)) body.topics[id] = { r, att: s.topics[id].att || 1 };
    }
    const sentResets = [...resetIds];
    const events = (s.queue || []).filter(canSend).slice(0, 200);
    if (events.length) body.events = events;
    const zp = Z.payload();
    if (zp) { body.zno = zp.zno; body.znoTotal = zp.znoTotal; }
    const np = NM.payload();
    if (np) body.nmt = np;
    const fp = FX.payload();
    if (fp) body.fix = fp;
    const d = await api(body);
    if (d && d.ok) {
      serverV = Number(d.v) || serverV;
      sentResets.forEach(id => resetIds.delete(id));
      if (zp) Z.sent(zp);
      if (events.length) { const gone = new Set(events); s.queue = (s.queue || []).filter(e => !gone.has(e)); saveLocal(); if (s.queue.some(canSend)) syncAgain = true; }
      setSync("saved");
    } else if (d && d.error === "auth") {
      delete s.token; saveLocal(); setSync("error");
      pmsg = "Увійдіть у профіль ще раз, щоб зберегти прогрес."; pmsgBad = true; renderProfile(); render();
    } else { setSync("error"); setTimeout(() => scheduleSync(true), 10000); }
    syncing = false;
    if (syncAgain) { syncAgain = false; scheduleSync(true); }
  }
  function mergeR(a, b) { let o = ""; for (let i = 0; i < N; i++) { const x = (a || EMPTY)[i] || ".", y = (b || EMPTY)[i] || "."; o += x !== "." ? x : y; } return o; }
  async function initSync() {
    if (!RESULTS_URL) { setSync("local"); return; }

    const key = store.current;
    const d = await api({ action: "load", key, token: s.token });

    else if (d && d.error === "auth") { delete s.token; saveLocal(); renderProfile(); render(); }

  /* ───── Рендер ───── */
  function renderOverall() {
    const s = me(); let a = 0, c = 0;
    T.forEach(t => { const st = statsOf(s && s.topics[t.id] ? s.topics[t.id].r : EMPTY); a += st.a; c += st.c; });
    const total = T.length * N;
    $("#overall").innerHTML = `<div class="overall-top"><span>Загальний прогрес: <b class="mono">${a}</b> з ${total} завдань</span><span>Правильно: <b class="mono">${c}</b> · <b class="mono">${(c / total * 100).toFixed(1)}%</b></span></div>
      <div class="bar" role="progressbar" aria-label="Загальний прогрес" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${a}"><b style="width:${a / total * 100}%"></b><i style="width:${c / total * 100}%"></i></div>`;
  }

    else if (ui.view === "nmt") { const h = NM.pageHtml(); if (h === null) renderHome(); else app.innerHTML = h; document.body.classList.toggle("exam", NM.inExam()); }

  function renderHome() {

  function reportSection() {

    if (confirmReset) h += `<div class="confirm"><b>Почати тему заново?</b><span>Усі відповіді цієї теми буде стерто, результат стане 0%.</span><div class="task-nav"><button class="btn danger" data-act="reset-yes">Так, стерти</button><button class="btn" data-act="reset-no">Скасувати</button></div></div>`;

  function taskCard(t, task, st) {
    const i = task.n, done = st.r[i] !== ".", resp = done ? st.ch[i] : undefined;

    h += bodyHtml(task, done, resp);
    if (done) {
      const ok = st.r[i] === "1";
      h += `<div class="fb ${ok ? "good" : "bad"}"><span class="verdict">${ok ? "Правильно! +1%" : "Помилка"}</span>${!ok ? correctHtml(task) : ""}${task.note ? `<span>${task.note}</span>` : ""}</div>`;
