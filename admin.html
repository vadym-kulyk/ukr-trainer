<style>
[hidden] { display: none !important; }
:root {
  --lime: #2445c7; --on-lime: #ffffff; --violet: #0d7a85; --yellow: #e5b33a; --stress: #b0245f; --stress-bg: #fbe3ee; --wrong: #c2382b; --right: #1e7f4f; --warn: #a86400; --bg: #ffffff; --surface: #f5f7fb; --surface-2: #eaeef6; --line: #d9e0ec; --text: #18223a; --muted: color-mix(in srgb, var(--text) 64%, transparent); --lime-ink: #2445c7; --violet-ink: #0a6670; --marker: #ffe58a; --right-bg: color-mix(in srgb, var(--right) 11%, transparent); --wrong-bg: color-mix(in srgb, var(--wrong) 10%, transparent); --f-display: 'Onest', 'Segoe UI', system-ui, sans-serif; --f-text: 'Onest', 'Segoe UI', system-ui, sans-serif; --f-mono: 'Onest', 'Segoe UI', system-ui, sans-serif; --r: 12px; --r-sm: 8px; color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --lime: #8fa6ff; --on-lime: #0d1430; --violet: #46bfcb; --yellow: #e3c063; --bg: #10162a; --surface: #172038; --surface-2: #1f2944; --line: #2c3756; --text: #e7ecf7; --wrong: #ff8072; --right: #52c48d; --warn: #e3c063; --lime-ink: #a8baff; --violet-ink: #7fd3dc; --marker: rgb(255 214 90 / .3); --stress: #ff86b4; --stress-bg: #4a1a33; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --lime: #8fa6ff; --on-lime: #0d1430; --violet: #46bfcb; --yellow: #e3c063; --bg: #10162a; --surface: #172038; --surface-2: #1f2944; --line: #2c3756; --text: #e7ecf7; --wrong: #ff8072; --right: #52c48d; --warn: #e3c063; --lime-ink: #a8baff; --violet-ink: #7fd3dc; --marker: rgb(255 214 90 / .3); --stress: #ff86b4; --stress-bg: #4a1a33; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--f-text); font-size: 16px; line-height: 1.5; overflow-x: hidden; }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.2; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
h2 { font-size: 20px; } h3 { font-size: 16px; } h4 { font-size: 14px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--violet-ink); }
:focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; }
.stack { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.spacer { flex: 1 1 auto; }

/* ── Кнопки, поля ── */
.btn { border: 2px solid var(--line); background: var(--bg); border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; text-decoration: none; color: inherit; }
.btn:hover { border-color: var(--violet); }
.btn.primary { background: var(--lime); border-color: var(--lime); color: var(--on-lime); }
.btn.danger { border-color: var(--wrong); color: var(--wrong); }
.btn.sm { min-height: 34px; padding: 4px 10px; font-size: 14px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.input, select.input, textarea.input { width: 100%; min-width: 0; border: 2px solid var(--line); border-radius: var(--r-sm); padding: 9px 12px; background: var(--bg); font-size: 16px; }
textarea.input { min-height: 120px; resize: vertical; }
.input:focus { outline: none; border-color: var(--lime); }
.check { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
.check input { width: 20px; height: 20px; accent-color: var(--violet); }
.hint { font-size: 14px; color: var(--muted); }
.err { color: var(--wrong); font-weight: 700; }

/* ── Вхід ── */
.login { max-width: 420px; margin: 8vh auto; padding: 24px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); display: grid; gap: 14px; }
.login img { width: 150px; }

/* ── Шапка панелі ── */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top .wrap { display: grid; gap: 8px; padding-block: 10px 8px; }
.top-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.top-row .logo { width: 110px; flex: none; }
.top-row h1 { font-size: 15px; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.top-row .btn { flex: none; }
.top-row .wordmark { font-size: 22px; }
.login .wordmark { font-size: 30px; display: block; text-align: center; }
/* Назва сайту текстом замість логотипа. */
.wordmark { width: auto !important; font-family: var(--f-display); font-weight: 800; font-size: clamp(24px, 6.5vw, 32px); line-height: 1; letter-spacing: -.02em; color: var(--lime-ink); white-space: nowrap; }
@media (max-width: 480px) { .top-row .logo { width: 88px; } .top-row .wordmark { font-size: 18px; } .top-row h1 { font-size: 13px; } .top-row .btn .small { display: none; } }
.nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.nav::-webkit-scrollbar { display: none; }
.nav a { flex: none; padding: 7px 12px; border-radius: 999px; font-weight: 700; font-size: 14px; text-decoration: none; color: var(--text); background: var(--surface-2); white-space: nowrap; }
.nav a.on { background: var(--lime); color: var(--on-lime); }
.badge { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--wrong); color: #fff; font-size: 11px; font-weight: 800; margin-left: 4px; vertical-align: 1px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filters select { width: auto; min-height: 36px; padding: 4px 10px; font-size: 14px; }
main.wrap { padding-block: 18px 60px; }

/* ── Картки, показники ── */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; grid-template-columns: minmax(0, 1fr); }
.card > h3 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.grid2 { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }
.kpis { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px; display: grid; gap: 2px; min-width: 0; }
.kpi b { font-family: var(--f-display); font-size: 22px; line-height: 1.15; overflow-wrap: anywhere; }
.kpi span { font-size: 13px; color: var(--muted); }
.kpi em { font-style: normal; font-size: 12px; color: var(--muted); }
.pbar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; position: relative; min-width: 60px; }
.pbar i { position: absolute; inset: 0 auto 0 0; border-radius: 999px; }
.lvl0 { background: #d93025; } .lvl1 { background: #f57c00; } .lvl2 { background: #f9ab00; } .lvl3 { background: #7cb342; } .lvl4 { background: #1e8e3e; }
.pct { font-family: var(--f-mono); font-weight: 600; font-size: 14px; }
select.input { max-width: 100%; text-overflow: ellipsis; }
.row > select.input, .row > .input { min-width: 0; }
.chips .tag, .card > h3 .tag { white-space: normal; overflow-wrap: anywhere; }
.card .row > h3, .card .row > h2 { min-width: 0; overflow-wrap: anywhere; }
.tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); white-space: nowrap; }
.tag.red { background: var(--wrong-bg); color: var(--wrong); }
.tag.green { background: var(--right-bg); color: var(--right); }
.tag.violet { background: color-mix(in srgb, var(--violet) 18%, transparent); color: var(--violet-ink); }
.empty { color: var(--muted); padding: 10px 0; }

/* ── Таблиці ── */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--bg); }
table.t { border-collapse: collapse; width: 100%; font-size: 14px; }
.t th, .t td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
.t td.wrapcell { white-space: normal; min-width: 220px; }
.t th { background: var(--surface-2); font-size: 12px; letter-spacing: .03em; text-transform: uppercase; position: sticky; top: 0; }
.t th[data-sort] { cursor: pointer; user-select: none; }
.t th[data-sort]::after { content: " ↕"; opacity: .35; }
.t th.asc::after { content: " ↑"; opacity: 1; } .t th.desc::after { content: " ↓"; opacity: 1; }
.t tr:last-child td { border-bottom: 0; }
.t tr.click { cursor: pointer; } .t tr.click:hover td { background: var(--surface); }
.t .num { text-align: right; font-family: var(--f-mono); }
.cellbar { display: flex; align-items: center; gap: 8px; min-width: 120px; }
.cellbar .pbar { flex: 1 1 auto; }

/* ── Графік ── */
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 20px; font-family: var(--f-mono); }
.chart { color: var(--text); }
.chart .b { fill: color-mix(in srgb, var(--violet) 55%, transparent); }
.chart .b2 { fill: var(--lime); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* ── Карта завдань теми ── */
.heat { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; }
.heat button { aspect-ratio: 1; border-radius: 6px; border: 1px solid var(--line); font-family: var(--f-mono); font-size: 11px; padding: 0; background: var(--surface); color: var(--text); min-width: 0; }
.heat button.sel { outline: 3px solid var(--violet); outline-offset: 1px; }
.task-view { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px; display: grid; gap: 8px; background: var(--bg); }
.task-view .q { font-weight: 700; }
.task-view .big { font-family: var(--f-display); font-size: 18px; }
.task-view ul { margin: 0; padding-left: 20px; }
.task-view .ok { color: var(--right); font-weight: 700; }
.gap { display: inline-block; min-width: 1.6em; border-bottom: 3px solid var(--lime); text-align: center; }
.st { color: var(--stress); background: var(--stress-bg); font-weight: 900; border-radius: 3px; padding: 0 1px; text-decoration: underline 3px var(--stress); text-underline-offset: 4px; }
.task-view img { max-width: 100%; height: auto; }

/* ── Списки, повідомлення ── */
.list { display: grid; gap: 10px; }
.item { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px; display: grid; gap: 6px; background: var(--bg); min-width: 0; }
.item.unread { border-color: var(--violet); box-shadow: 0 0 0 2px color-mix(in srgb, var(--violet) 25%, transparent); }
.item .meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); align-items: center; }
.item .text { white-space: pre-wrap; overflow-wrap: anywhere; }
.picker { max-height: 260px; overflow: auto; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px; display: grid; gap: 4px; background: var(--bg); }
.picker .grp { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-top: 6px; }
.seg { display: inline-flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 999px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 14px; }
.seg button.on { background: var(--lime); color: var(--on-lime); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { border: 2px solid var(--line); background: var(--bg); border-radius: 999px; padding: 4px 12px; font-weight: 700; font-size: 14px; }
.chips button.on { background: var(--violet); border-color: var(--violet); color: #fff; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 700; z-index: 60; max-width: calc(100vw - 32px); }
.crumbs { font-size: 14px; }
.crumbs a { text-decoration: none; font-weight: 700; }
.loading { padding: 40px 0; text-align: center; color: var(--muted); }
.dl { font-size: 13px; font-family: var(--f-text); font-weight: 700; white-space: nowrap; }
.dl.up { color: var(--right); } .dl.down { color: var(--wrong); } .dl.eq { color: var(--muted); }
.chart .dot { fill: var(--lime-ink); stroke: var(--bg); stroke-width: 2; }
.live-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.live { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; display: grid; gap: 6px; min-width: 0; }
.live.on { border-left-color: var(--right); } .live.idle { border-left-color: var(--warn); }
.ldot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
.live.on .ldot { background: var(--right); box-shadow: 0 0 0 4px var(--right-bg); } .live.idle .ldot { background: var(--warn); }
.seq { display: flex; flex-wrap: wrap; gap: 3px; }
.seq i { font-style: normal; width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-size: 12px; font-weight: 800; }
.seq i.ok { background: var(--right-bg); color: var(--right); } .seq i.no { background: var(--wrong-bg); color: var(--wrong); }
.item.sg .text { font-size: 14px; }
.upd { color: var(--lime-ink); font-weight: 600; animation: updPulse 1.2s ease-in-out infinite; }
@keyframes updPulse { 50% { opacity: .45; } }
@media (prefers-reduced-motion: reduce) { .upd { animation: none; } }
/* ── Урок наживо: таблиця «учні × завдання» ── */
.lg-groups button { font-size: 13px; }
.lg-cnt { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 2px; border-radius: 999px; background: var(--surface-2); color: var(--text); font-size: 11px; }
.lg-groups button.on .lg-cnt { background: rgba(255,255,255,.25); color: #fff; }
.lg-tools { margin: 10px 0 8px; }
.lg-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-sm); max-width: 100%; -webkit-overflow-scrolling: touch; }
.lg { border-collapse: separate; border-spacing: 0; font-size: 14px; min-width: 100%; }
.lg th, .lg td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--bg); padding: 0; text-align: center; height: 44px; }
.lg thead th { background: var(--surface-2); font-weight: 700; position: sticky; top: 0; z-index: 2; }
.lg .lg-nm { position: sticky; left: 0; z-index: 1; background: var(--surface); text-align: left; padding: 0 10px; white-space: nowrap; max-width: 170px; overflow: hidden; text-overflow: ellipsis; font-weight: 600; box-shadow: 1px 0 0 var(--line); }
.lg thead .lg-nm { z-index: 3; background: var(--surface-2); }
.lg .lg-nm a { text-decoration: none; color: inherit; }
.lg .lg-nm .ldot { display: inline-block; vertical-align: middle; margin-right: 6px; width: 8px; height: 8px; }
.lg .ldot.on { background: var(--right); } .lg .ldot.idle { background: var(--warn); }
.lg-flag { color: var(--wrong); font-weight: 900; cursor: help; }
.lg .lg-pc { min-width: 48px; padding: 0 6px; font-weight: 700; font-family: var(--f-mono); font-size: 13px; border-left: 4px solid transparent; }
.lg td.lg-pc.hi { border-left-color: var(--right); } .lg td.lg-pc.mid { border-left-color: var(--warn); } .lg td.lg-pc.lo { border-left-color: var(--wrong); }
.lg-h { border: 0; background: transparent; width: 100%; min-width: 46px; height: 100%; min-height: 50px; display: grid; place-items: center; gap: 0; padding: 4px 2px; font: inherit; font-weight: 800; color: var(--text); cursor: pointer; }
.lg-h:hover, .lg-h:focus-visible { background: color-mix(in srgb, var(--violet) 14%, transparent); }
.lg-h span:first-child { text-decoration: underline dotted 1px; text-underline-offset: 3px; }
.lg-hs { font-size: 10px; font-weight: 700; color: var(--right); font-family: var(--f-mono); }
.lg-hs.no { color: var(--wrong); }
.lg td.c1 { background: var(--right-bg); } .lg td.c0 { background: var(--wrong-bg); }
.lg td button { border: 0; background: transparent; width: 100%; height: 100%; min-width: 46px; min-height: 44px; font-size: 18px; font-weight: 900; cursor: pointer; padding: 0; }
.lg td.c1 button { color: var(--right); } .lg td.c0 button { color: var(--wrong); }
.lg td button sup { font-size: 9px; font-weight: 700; opacity: .8; }
.lg td button:hover, .lg td button:focus-visible { outline: 2px solid var(--violet); outline-offset: -2px; }
.lg tbody tr:hover .lg-nm { background: var(--surface-2); }
.lmodal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; }
.lmodal-bg { position: absolute; inset: 0; border: 0; background: rgba(15, 12, 22, .55); cursor: pointer; }
.lmodal-box { position: relative; background: var(--surface); color: var(--text); border-radius: var(--r-sm); width: min(780px, 100%); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overflow: auto; padding: 16px; display: grid; gap: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.lm-head { position: sticky; top: -16px; background: var(--surface); padding: 6px 0; z-index: 1; gap: 6px; }
.lm-who { padding: 8px 12px; border-radius: var(--r-sm); font-weight: 700; }
.lm-who.ok { background: var(--right-bg); color: var(--right); } .lm-who.no { background: var(--wrong-bg); color: var(--wrong); }
.lm-stat { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.lmodal h4 { margin: 0 0 6px; }
.lmodal.proj .lmodal-box { width: min(1100px, 100%); }
.lmodal.proj .task-view { font-size: 24px; } .lmodal.proj .task-view .big { font-size: 34px; }
.lmodal.proj .item b { font-size: 20px; }
.task-view.hide-ans .ok { color: inherit; font-weight: inherit; } .task-view.hide-ans .okm, .task-view.hide-ans > .hint, .task-view.hide-ans > p:has(.ok) { display: none; }
@media (max-width: 600px) {
  .lmodal { padding: 0; }
  .lmodal-box { width: 100%; height: 100%; max-height: none; border-radius: 0; }
  .lg .lg-nm { max-width: 120px; padding: 0 6px; font-size: 13px; }
  .lmodal.proj .task-view { font-size: 19px; }
  .lm-keys { display: none; }
}
details.more > summary { cursor: pointer; font-weight: 700; }
.ans-list { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line, rgba(127,127,127,.25)); display: grid; gap: 6px; }
.ans-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.ans-row .ans-txt { flex: 1 1 220px; min-width: 0; overflow-wrap: anywhere; }
@media print {
  .top, .noprint, .btn { display: none !important; }
  body { background: #fff; color: #000; }
  .card, .kpi { break-inside: avoid; }
}

/* ═════ Дизайн «Дослівно» (спільний із сайтом) ═════ */
h1, h2, h3, h4 { font-weight: 700; letter-spacing: -0.018em; }
:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
.wordmark { color: var(--text) !important; font-weight: 800; letter-spacing: -0.035em; }
.wm-st { color: var(--stress); text-decoration: underline 3px var(--stress); text-underline-offset: 5px; text-decoration-skip-ink: none; }
.btn { border-width: 1px; border-radius: var(--r-sm); font-weight: 600; }
.btn:hover { border-color: var(--text); }
.btn.primary { background: var(--lime); border-color: var(--lime); color: var(--on-lime); }
.btn.primary:hover { background: color-mix(in srgb, var(--lime) 86%, var(--text)); border-color: transparent; }
.card { background: var(--bg); }
.kpi { background: var(--surface); }
.kpi b { font-weight: 700; letter-spacing: -0.02em; }
.tag, .badge, .pill { border-radius: 4px; }
.field > span, .t th, .tbl th { text-transform: none; letter-spacing: 0; font-weight: 600; }
.input, select.input, textarea.input { border-width: 1px; }
.input:focus { border-color: var(--lime); box-shadow: 0 0 0 3px color-mix(in srgb, var(--lime) 18%, transparent); }
