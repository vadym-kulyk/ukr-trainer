<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Звіт про навчання · Midgard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root {
  --lime: #99cc00; --violet: #9d6bdb; --wrong: #c13f2c; --right: #3f7a16; --warn: #b26a00;
  --bg: #ffffff; --surface: #faf8fc; --surface-2: #f2eef8; --line: #e5e0ee; --text: #1e1b26;
  --muted: color-mix(in srgb, var(--text) 62%, transparent); --lime-ink: #3f6a00; --violet-ink: #6b3fb0;
  --right-bg: color-mix(in srgb, var(--right) 13%, transparent); --wrong-bg: color-mix(in srgb, var(--wrong) 12%, transparent);
  --f-display: 'Unbounded', system-ui, sans-serif; --f-text: 'Manrope', system-ui, sans-serif; --r: 18px; --r-sm: 10px; color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12101a; --surface: #1b1826; --surface-2: #231f31; --line: #332d44; --text: #f4f1f9; --wrong: #ff7a5e; --right: #a5d914; --lime-ink: #b8e63a; --violet-ink: #c4a3f0; color-scheme: dark;
} }
:root[data-theme="dark"] { --bg: #12101a; --surface: #1b1826; --surface-2: #231f31; --line: #332d44; --text: #f4f1f9; --wrong: #ff7a5e; --right: #a5d914; --lime-ink: #b8e63a; --violet-ink: #c4a3f0; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 var(--f-text); overflow-x: hidden; }
.wrap { max-width: 900px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; line-height: 1.2; } h1 { font-size: 24px; } h2 { font-size: 18px; } h3 { font-size: 15px; }
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; } .top img { height: 34px; } .spacer { flex: 1; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; min-width: 0; }
.hint { color: var(--muted); font-size: 14px; margin: 0; }
.kpis { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
.kpi { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.kpi b { font: 700 22px/1.15 var(--f-display); } .kpi span { font-size: 13px; color: var(--muted); }
.btn { font: 700 15px var(--f-text); border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 999px; padding: 9px 16px; cursor: pointer; }
.btn.primary { background: var(--lime); border-color: var(--lime); color: #1e1b26; }
.rows { display: grid; gap: 6px; }
.trow { display: grid; grid-template-columns: minmax(0, 1fr) 120px 52px; gap: 10px; align-items: center; font-size: 14px; }
.pbar { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; } .pbar i { display: block; height: 100%; background: var(--lime); border-radius: 999px; }
.pbar i.low { background: var(--wrong); } .pbar i.mid { background: var(--warn); }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; } .tag { font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); }
.tag.red { background: var(--wrong-bg); color: var(--wrong); } .tag.green { background: var(--right-bg); color: var(--right); }
.chart { width: 100%; height: auto; display: block; color: var(--muted); } .chart rect { fill: color-mix(in srgb, var(--violet) 60%, transparent); } .chart text { font-size: 12px; fill: currentColor; }
.err { color: var(--wrong); }
@media (max-width: 520px) { .trow { grid-template-columns: minmax(0, 1fr) 70px 44px; } h1 { font-size: 20px; } }
@media print { .noprint { display: none !important; } body { background: #fff; color: #000; } .card { break-inside: avoid; border-color: #ccc; } }
</style>
</head>
<body>
<div class="wrap" id="root"><p class="hint">Завантажую звіт…</p></div>
<script src="config.js"></script>
<script>
(function () {
  "use strict";
  const API = (window.MG_CONFIG && window.MG_CONFIG.resultsUrl || "").trim();
  const root = document.getElementById("root");
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pct = v => v == null ? "—" : Math.round(v * 100) + "%";
  const DAY = 86400000, pad = n => String(n).padStart(2, "0");
  const dk = t => { const d = new Date(t); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
  const r = new URLSearchParams(location.search).get("r") || "";
  // Підпис посилання не передаємо іншим сайтам (meta referrer = no-referrer).
  const fail = msg => { root.innerHTML = `<div class="card"><h1>Звіт про навчання</h1><p class="err">${esc(msg)}</p><p class="hint">Попросіть учителя надіслати нове посилання.</p></div>`; };
  if (!API) return fail("Сайт не підключено до таблиці результатів.");
  if (!r) return fail("У посиланні немає підпису.");

  async function load() {
    for (let i = 0; i < 3; i++) {
      try {
        const res = await fetch(API, { method: "POST", credentials: "omit", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "parent", t: r }) });
        const d = JSON.parse(await res.text());
        if (d && (d.ok || d.error !== "server")) return d;
      } catch (e) {}
      await new Promise(z => setTimeout(z, 1200 * (i + 1)));
    }
    return null;
  }
  function streak(days) { if (!days) return 0; let n = 0, t = Date.now(); if (!days[dk(t)]) t -= DAY; while (days[dk(t)]) { n++; t -= DAY; } return n; }
  function week(dn, back) { const now = new Date(); now.setHours(0, 0, 0, 0); now.setDate(now.getDate() - (now.getDay() + 6) % 7 - back * 7); let n = 0, ok = 0; for (let i = 0; i < 7; i++) { const x = (dn || {})[dk(now.getTime() + i * DAY)]; if (x) { n += x[0]; ok += x[1]; } } return { n, ok }; }
  function chart(days) {
    const W = 720, H = 160, n = 30, list = [];
    for (let i = n - 1; i >= 0; i--) { const k = dk(Date.now() - i * DAY); list.push({ k, v: (days || {})[k] || 0 }); }
    const max = Math.max(1, ...list.map(x => x.v)), bw = W / n;
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Активність за 30 днів">` + list.map((x, i) => { const hh = (H - 28) * x.v / max; return `<rect x="${i * bw + 2}" y="${H - 20 - hh}" width="${bw - 4}" height="${hh}" rx="2"><title>${x.k}: ${x.v}</title></rect>` + (i % 5 === 0 ? `<text x="${i * bw + bw / 2}" y="${H - 4}" text-anchor="middle">${x.k.slice(8)}.${x.k.slice(5, 7)}</text>` : ""); }).join("") + "</svg>";
  }

  load().then(d => {
    if (!d) return fail("Немає зв’язку з сервером. Спробуйте пізніше.");
    if (!d.ok) return fail(d.error === "link" ? "Посилання недійсне або застаріле." : "Не вдалося завантажити звіт.");
    const t = d.topics, a = t.reduce((x, y) => x + y.a, 0), c = t.reduce((x, y) => x + y.c, 0);
    const act = d.act || {}, w0 = week(act.dn, 0), w1 = week(act.dn, 1), plus = d.plus || {};
    const started = t.filter(x => x.a >= 10).map(x => Object.assign({ acc: x.c / x.a }, x));
    const weak = started.filter(x => x.acc < 0.6).sort((x, y) => x.acc - y.acc).slice(0, 5), strong = started.filter(x => x.acc >= 0.85).sort((x, y) => y.acc - x.acc).slice(0, 5);
    const diag = plus.diag;
    let h = `<div class="top"><img src="img/logo-wordmark.png" alt="Midgard"><span class="spacer"></span><button class="btn noprint" onclick="window.print()">🖨 Друк / PDF</button></div>
      <div class="card"><h1>Звіт про навчання</h1><p><b>${esc(d.name)}</b>, клас ${esc(d.cls)}</p><p class="hint">Українська мова: тренажер, завдання ЗНО й симуляції НМТ. Сформовано ${new Date(d.now).toLocaleString("uk-UA")}.</p>
      <div class="kpis"><div class="kpi"><b>${a} / ${t.length * 100}</b><span>виконано завдань тренажера</span></div><div class="kpi"><b>${pct(a ? c / a : null)}</b><span>правильних відповідей</span></div>
      <div class="kpi"><b>${d.zno.a ? pct(d.zno.c / d.zno.a) : "—"}</b><span>точність у завданнях ЗНО (${d.zno.a})</span></div><div class="kpi"><b>${d.nmt.best || "—"}</b><span>найкращий бал симуляції НМТ (100–200)</span></div>
      <div class="kpi"><b>🔥 ${streak(plus.days)}</b><span>днів поспіль із заняттями</span></div><div class="kpi"><b>${act.mins != null ? (act.mins >= 60 ? (act.mins / 60).toFixed(1).replace(".", ",") + " год" : act.mins + " хв") : "—"}</b><span>час занять (орієнтовно)</span></div>
      <div class="kpi"><b>${w0.n}</b><span>відповідей цього тижня (минулого: ${w1.n})</span></div><div class="kpi"><b>${d.fix ? d.fix.done + " / " + (d.fix.done + d.fix.open) : "—"}</b><span>виправлено помилок</span></div></div></div>
      <div class="card"><h2>Активність за 30 днів</h2>${chart(act.days)}<p class="hint">Кількість відповідей щодня.</p></div>`;
    if (weak.length || strong.length) h += `<div class="card"><h2>Що вдається, а над чим попрацювати</h2>
      ${strong.length ? `<h3>Добре знає</h3><div class="chips">${strong.map(x => `<span class="tag green">${esc(x.title)} · ${pct(x.acc)}</span>`).join("")}</div>` : ""}
      ${weak.length ? `<h3>Варто повторити</h3><div class="chips">${weak.map(x => `<span class="tag red">${esc(x.title)} · ${pct(x.acc)}</span>`).join("")}</div>` : ""}</div>`;
    if (diag && diag.res) { const n = Object.keys(diag.res).length, ok = Object.values(diag.res).filter(v => v === "1").length; h += `<div class="card"><h2>Діагностика</h2><p>Правильно ${ok} з ${n} (по одному завданню з кожної теми)${diag.at ? ", " + new Date(diag.at).toLocaleDateString("uk-UA") : ""}.</p></div>`; }
    if (d.tests && d.tests.length) h += `<div class="card"><h2>Моніторингові роботи</h2><div class="rows">${d.tests.map(x => `<div class="trow"><span>${esc(x.title)} <span class="hint">· ${new Date(x.done).toLocaleDateString("uk-UA")}</span></span><span class="num">${x.score}/${x.max}</span><b class="num">${x.grade}</b></div>`).join("")}</div><p class="hint">Оцінка — за 12-бальною шкалою.</p></div>`;
    if (d.assign && d.assign.length) h += `<div class="card"><h2>Завдання від учителя</h2><div class="rows">${d.assign.map(x => { const ts = x.items.filter(i => i[0] === "t").map(i => t.find(z => z.id === i.slice(2))).filter(Boolean); const p = ts.length ? ts.reduce((s, z) => s + z.a / 100, 0) / ts.length : null; return `<div class="trow"><span>${esc(x.title)}${x.due ? ` <span class="hint">· до ${new Date(x.due).toLocaleDateString("uk-UA")}</span>` : ""}</span><div class="pbar">${p != null ? `<i style="width:${p * 100}%"></i>` : ""}</div><span class="num">${p != null ? pct(p) : ""}</span></div>`; }).join("")}</div></div>`;
    h += `<div class="card"><h2>Теми тренажера</h2><p class="hint">Смужка — скільки зі 100 завдань теми виконано; число — частка правильних.</p><div class="rows">${t.map(x => `<div class="trow"><span>${esc(x.title)}</span><div class="pbar"><i class="${x.a && x.c / x.a < 0.6 ? "low" : x.a && x.c / x.a < 0.8 ? "mid" : ""}" style="width:${x.a}%"></i></div><span class="num">${x.a ? pct(x.c / x.a) : "—"}</span></div>`).join("")}</div></div>
      <p class="hint">Посилання особисте: воно відкриває звіт лише цього учня. Не пересилайте його стороннім. Якщо посилання потрапило до чужих рук, попросіть учителя створити нове — старе перестане працювати.</p>`;
    root.innerHTML = h;
  });
})();
</script>
</body>
</html>
